id: 9
title: "辞書と集合"
phase: A
prerequisites: [8]
learning_goals:
  - "辞書 (dict) で key-value を扱える"
  - "辞書の追加・更新・参照ができる"
  - "items / keys / values で反復できる"
  - "set で重複排除ができる"

pages:
  - kind: sample
    title: "辞書の基本"
    markdown: |
      ## 辞書 = key→value の対応表
      `{key: value}` で書きます。
      ファンドの属性管理など、名前で値を引きたいときに便利。
    sample_code: |
      fund = {"name": "AAA Fund", "expense_ratio": 0.012, "aum": 5e9}
      print(fund["name"])
      print(fund["expense_ratio"])
      fund["nav"] = 12345.67   # 追加
      print(fund)
    runnable: true
    stickman: explain
    stickman_speech: "[ ] でアクセスし、新しい key も同じ書き方で追加できるよ。"

  - kind: sample
    title: "辞書の反復"
    markdown: |
      `for k, v in dict.items():` で key と value を同時に取り出せます。
    sample_code: |
      ratios = {"A": 0.012, "B": 0.008, "C": 0.020}
      for k, v in ratios.items():
          print(f"{k}: {v:.3f}")
    runnable: true
    stickman: explain
    stickman_speech: "items() を覚えると一気に書きやすくなるよ。"

  - kind: exercise
    title: "ファンドの経費率を取り出そう"
    prompt: |
      辞書（dict）はリストと違い「**キーで値を引く**」ためのデータ型です。順番ではなく **意味** で値にアクセスできます。

      ```python
      fund["name"]            # "AAA Fund"
      fund["expense_ratio"]   # 0.012
      ```

      存在しないキーで引くと `KeyError` になります。安全に取りたいときは `fund.get("missing", デフォルト値)` を使います。

      JSON データや CSV の 1 行などはほぼ辞書形式で扱うので、現場では毎日触ります。
    code_template: |
      fund = {"name": "AAA Fund", "expense_ratio": 0.012, "aum": 5e9}
      er = fund[{{slot:key}}]
      print(round(er, 4))
    blanks:
      - id: key
        placeholder: '"..."'
        width: 18
        accept_patterns:
          - '^"expense_ratio"$'
          - "^'expense_ratio'$"
        canonical_answer: '"expense_ratio"'
        hint: 'キーは文字列なのでクォートで囲む'
    test_cases:
      - kind: stdout_regex
        pattern: '^0\.012\s*$'
      - kind: namespace_check
        asserts:
          - "abs(er - 0.012) < 1e-6"
    hints:
      - "辞書のキーは文字列ならクォートが必要。"
      - "`\"expense_ratio\"` を入れてね。"
    stickman_feedback:
      correct: "辞書アクセスは現場で毎日使う基本だよ！"
      wrong_hint1: "キーをクォートで囲もう。"
      wrong_hint2: '`"expense_ratio"` だね。'
      wrong_hint3: '答えは `"expense_ratio"`。'

  - kind: exercise
    title: "items() で全銘柄の経費率を表示しよう"
    prompt: |
      辞書を `for` で回すと **キーだけ** が取れます。値も同時に欲しいときは `.items()` を使い **タプルアンパック** で 2 つの変数に展開します。

      ```python
      for k, v in ratios.items():    # k=キー, v=値
          ...
      ```

      これは Python らしい書き方の代表例。`.keys()` だけ、`.values()` だけ、というメソッドもありますが、`.items()` が最も使用頻度が高いです。
    code_template: |
      ratios = {"A": 0.012, "B": 0.008, "C": 0.020}
      for k, v in ratios.{{slot:method}}():
          print(f"{k}: {v}")
    blanks:
      - id: method
        placeholder: "メソッド名"
        width: 8
        accept_patterns:
          - '^items$'
        canonical_answer: "items"
        hint: "key と value を同時に取り出すメソッド"
    test_cases:
      - kind: stdout_regex
        pattern: 'A: 0\.012'
      - kind: stdout_regex
        pattern: 'B: 0\.008'
    hints:
      - "key と value を同時に取り出すのは items。"
      - "`items` を入れてね。"
    stickman_feedback:
      correct: "items() でループするのは Python らしい書き方！"
      wrong_hint1: "メソッドは items。"
      wrong_hint2: "`items` だね。"
      wrong_hint3: "答えは `items`。"

  # ─── 参考実装: ティッカー→社名マップと集合演算 ──────────
  - kind: sample
    title: "参考実装 — ティッカー辞書と集合演算（リバランス）"
    markdown: |
      ## 辞書 = ID → 詳細データのマッピング、集合 = 差分検出

      実務でよくある 2 つのパターン:

      1. **マスター辞書** で「ティッカー → 社名・セクター」を引く
      2. **集合演算** で「先月の組入銘柄」と「今月の組入銘柄」の差分（売買予定）を出す

      | 集合演算 | 意味 | 金融での例 |
      |---|---|---|
      | `A \| B` | 和集合 (どちらか) | 全期間にいた銘柄 |
      | `A & B` | 積集合 (両方) | 連続組入銘柄 |
      | `A - B` | 差集合 (A だけ) | **新規組入 (B にない)** |
      | `B - A` | 差集合 (B だけ) | **除外銘柄 (A にない)** |

      これは **リバランス工程の自動化** で必須のテクニック。
    sample_code: |
      # ティッカー → メタデータの辞書
      master = {
          "AAPL": {"name": "Apple Inc.",         "sector": "Tech"},
          "MSFT": {"name": "Microsoft Corp.",    "sector": "Tech"},
          "GS":   {"name": "Goldman Sachs",      "sector": "Financials"},
          "JNJ":  {"name": "Johnson & Johnson",  "sector": "Healthcare"},
          "XOM":  {"name": "Exxon Mobil",        "sector": "Energy"},
      }

      print("--- 辞書から取り出す ---")
      for t in ["AAPL", "GS"]:
          info = master[t]
          print(f"  {t}: {info['name']} ({info['sector']})")

      # 先月の組入と今月の組入
      last_month = {"AAPL", "MSFT", "GS", "JNJ"}
      this_month = {"AAPL", "MSFT", "XOM", "JNJ"}

      print(f"\n両月共通    (持ち越し): {last_month & this_month}")
      print(f"新規組入 (今月 - 先月): {this_month - last_month}")
      print(f"除外      (先月 - 今月): {last_month - this_month}")
      print(f"全期間在籍 (和集合)   : {last_month | this_month}")
    runnable: true
    stickman: explain
    stickman_speech: "辞書と集合は実務で 1 日 100 回使う道具。慣れたら反射的に手が動くようになる。"
