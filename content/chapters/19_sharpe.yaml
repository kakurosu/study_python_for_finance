id: 19
title: "シャープレシオ・情報比率"
phase: C
prerequisites: [18]
learning_goals:
  - "シャープレシオ SR = (μ - rf) / σ を計算できる"
  - "情報比率 IR = α / TE を計算できる"
  - "両指標が「リスク 1 単位あたりのリターン」であることを理解する"

pages:
  - kind: sample
    title: "シャープレシオ — リスク調整リターン"
    markdown: |
      ## SR = (期待リターン − リスクフリー) ÷ ボラティリティ
      「**取ったリスク 1 単位** あたりに、無リスク資産より **どれだけ稼いだか**」を測る指標。
      高いほど効率の良い運用。一般的に SR > 1 は優秀、> 2 は卓越。
    sample_code: |
      def sharpe_ratio(mu, vol, rf=0.0):
          return (mu - rf) / vol

      print("Fund A:", round(sharpe_ratio(0.10, 0.18, 0.02), 4))
      print("Fund B:", round(sharpe_ratio(0.06, 0.08, 0.02), 4))
    runnable: true
    expected_output: "Fund A: 0.4444\nFund B: 0.5"
    stickman: explain
    stickman_speech: "リターンが高くてもリスクが大きいと SR は下がる！"

  - kind: sample
    title: "情報比率 (IR)"
    markdown: |
      ## IR = α ÷ TE
      ベンチマーク **対比** の評価指標です。
      - **α (アルファ)**: ベンチマーク超過の期待リターン (= 平均アクティブリターン)
      - **TE**: アクティブリターンのボラ（前章）

      アクティブ運用の腕前を測る代表指標。
    sample_code: |
      alpha = 0.03   # ベンチ対比 +3%
      te = 0.04
      ir = alpha / te
      print(round(ir, 4))
    runnable: true
    expected_output: "0.75"
    stickman: explain
    stickman_speech: "IR > 0.5 はそこそこ、> 1 は優秀なアクティブマネージャー！"

  - kind: exercise
    title: "シャープレシオ関数を作ろう"
    prompt: |
      **シャープレシオ（Sharpe Ratio, SR）** は William Sharpe が提唱（ノーベル経済学賞）したリスク調整リターン指標:

      $$ SR = \frac{\mu - r_f}{\sigma} $$

      意味:「**1 単位のリスク** で何 % の超過リターンが得られるか」。
      - **SR > 1** : 優秀
      - **SR > 2** : 卓越（プロでもなかなか到達しない）
      - **SR < 0** : 無リスク資産以下（運用する価値なし）

      `rf=0.0` をデフォルトにすると、`sharpe(mu, vol)` のように `rf` を省略して呼べます。同じ関数を複数の場面で再利用しやすくなります。
    code_template: |
      def sharpe(mu, vol, {{slot:rf_arg}}):
          return {{slot:formula}}

      print(round(sharpe(0.10, 0.18, 0.02), 4))
      print(round(sharpe(0.10, 0.18), 4))
    blanks:
      - id: rf_arg
        canonical_answer: "rf=0.0"
        accept_patterns:
          - '^rf\s*=\s*0\.0?$'
          - '^rf\s*=\s*0$'
        hint: "デフォルト 0 のキーワード引数"
      - id: formula
        canonical_answer: "(mu - rf) / vol"
        accept_patterns:
          - '^\(?\s*mu\s*-\s*rf\s*\)?\s*/\s*vol$'
        hint: "(mu - rf) / vol"
    test_cases:
      - kind: stdout_regex
        pattern: '^0\.4444\s*\n0\.5556\s*$'
    hints:
      - "`rf=0` をデフォルトにする。"
      - "式は `(mu - rf) / vol`。"
    stickman_feedback:
      correct: "デフォルト引数で柔軟な関数になったね！"
      wrong_hint1: "`rf=0.0` と `(mu - rf) / vol`。"
      wrong_hint2: "`rf=0.0` と `(mu - rf) / vol`。"
      wrong_hint3: "`rf=0.0` と `(mu - rf) / vol`。"

  - kind: exercise
    title: "情報比率を計算しよう"
    prompt: |
      アクティブリターンの **平均（年率）を α**、**標準偏差（年率）を TE** として、
      情報比率 IR を計算してください。
    code_template: |
      import numpy as np
      active = np.array([0.001, -0.0008, 0.002, 0.0012, -0.0005, 0.0015, 0.001])
      alpha = active.mean() * 252
      te = active.std(ddof=1) * np.sqrt(252)
      ir = {{slot:expr}}
      print(round(float(ir), 4))
    blanks:
      - id: expr
        canonical_answer: "alpha / te"
        accept_patterns:
          - '^alpha\s*/\s*te$'
        hint: "α ÷ TE"
    test_cases:
      - kind: stdout_regex
        pattern: '^\d+\.\d+\s*$'
      - kind: namespace_check
        asserts:
          - "ir > 0"
    hints:
      - "α / TE を入れるだけ。"
      - "`alpha / te`"
    stickman_feedback:
      correct: "IR がアクティブ運用の腕前だよ！"
      wrong_hint1: "`alpha / te`"
      wrong_hint2: "`alpha / te`"
      wrong_hint3: "`alpha / te`"

  # ─── 参考実装: 4 ファンドの SR / IR ランキング ───────────
  - kind: sample
    title: "参考実装 — Sharpe / Information Ratio ランキング"
    markdown: |
      ## 「リスク調整後リターン」で並べ直す

      生のリターンで並べると「リスクを取った分の上振れ」を見落とす。
      実務では **Sharpe Ratio (絶対)** と **Information Ratio (対ベンチマーク)** で並べる。

      $$ \text{SR} = \dfrac{\mu_p - r_f}{\sigma_p},\quad \text{IR} = \dfrac{\mu_p - \mu_b}{\sigma(r_p - r_b)} $$

      | 指標 | 何を測るか | 業界の合格ライン |
      |---|---|---|
      | SR | リスクフリーを上回るリターン / 全リスク | > 1.0 良好、> 2.0 優秀 |
      | IR | ベンチマーク超過 / トラッキングエラー | > 0.5 良好、> 1.0 優秀 |

      **注意**: SR は無リスク資産を想定するので **株式 100% 戦略には IR が適切**。
      混同するとパッシブとアクティブを区別できない。

      この Sample は `fund_returns.csv` の 4 ファンド + Bench で両指標を並べます。
    sample_code: |
      import pandas as pd

      df = pd.read_csv("data/fund_returns.csv", parse_dates=["YearMonth"]).set_index("YearMonth")
      funds = [c for c in df.columns if c != "Bench"]
      rf_monthly = 0.001  # 仮定: 月次無リスクレート 0.1%

      rows = []
      for f in funds:
          rp = df[f]
          rb = df["Bench"]
          excess = rp - rf_monthly
          active = rp - rb
          sr = (excess.mean() * 12) / (excess.std() * (12 ** 0.5))
          ir = (active.mean() * 12) / (active.std() * (12 ** 0.5))
          rows.append({"Fund": f, "SR": round(sr, 3), "IR": round(ir, 3),
                       "MeanAnn%": round(rp.mean() * 12 * 100, 2),
                       "VolAnn%":  round(rp.std()  * (12 ** 0.5) * 100, 2)})
      tbl = pd.DataFrame(rows).set_index("Fund")
      print("--- 元の順 ---")
      print(tbl)
      print("\n--- Sharpe で降順 ---")
      print(tbl.sort_values("SR", ascending=False))
      print("\n--- Information で降順 (ベンチ対比の優秀度) ---")
      print(tbl.sort_values("IR", ascending=False))
    runnable: true
    stickman: explain
    stickman_speech: "生リターンの順位と SR / IR の順位が違うことに気付くと、リスク調整の意味が腑に落ちる。"
