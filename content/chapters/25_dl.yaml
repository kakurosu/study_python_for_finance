id: 25
title: "ディープラーニング入門 (PyTorch)"
phase: D
prerequisites: [24]
learning_goals:
  - "PyTorch の Tensor / 自動微分の基本を理解する"
  - "1 層 MLP を nn.Linear で組める"
  - "forward / loss / backward / step の 1 イテレーションを書ける"

pages:
  - kind: sample
    title: "PyTorch の Tensor"
    markdown: |
      ## Tensor
      PyTorch の中心は **Tensor**（NumPy の ndarray と似た多次元配列）。
      `requires_grad=True` で **自動微分** が有効になります。
    sample_code: |
      import torch
      x = torch.tensor([1.0, 2.0, 3.0], requires_grad=True)
      y = (x ** 2).sum()
      y.backward()             # dy/dx = 2x
      print(x.grad)
    runnable: true
    expected_output: "tensor([2., 4., 6.])"
    stickman: explain
    stickman_speech: "Tensor + 自動微分が PyTorch のコア。"

  - kind: sample
    title: "勾配降下を可視化する（Loss Curve）"
    markdown: |
      ## 勾配降下の "学習が進む" を見る
      機械学習はループのたびに **損失（loss）が下がる** のを確認するのが基本動作。
      下のサンプルは 100 反復の loss を `losses` リストに集めて、最後にグラフ表示します。

      `forward → loss → backward → step` の 4 ステップが 1 反復。これを 100 回繰り返すと、loss が指数的に減衰して 0 に近づくのが見えます。
    sample_code: |
      import torch
      import torch.nn as nn
      import matplotlib.pyplot as plt

      torch.manual_seed(0)
      model = nn.Sequential(nn.Linear(2, 1), nn.Sigmoid())
      X = torch.randn(64, 2)
      y = (X.sum(dim=1) > 0).float().unsqueeze(1)
      opt = torch.optim.Adam(model.parameters(), lr=0.1)
      loss_fn = nn.BCELoss()

      losses = []
      for step in range(100):
          opt.zero_grad()
          loss = loss_fn(model(X), y)
          loss.backward()
          opt.step()
          losses.append(float(loss))

      print(f"初期 loss: {losses[0]:.3f}  →  最終 loss: {losses[-1]:.3f}")

      plt.figure(figsize=(7, 3))
      plt.plot(losses, color="#DC2626", linewidth=2)
      plt.title("Training Loss")
      plt.xlabel("Iteration")
      plt.ylabel("BCE Loss")
      plt.grid(True, alpha=0.3)
      plt.tight_layout()
      plt.show()
    runnable: true
    stickman: explain
    stickman_speech: "実行すると、loss が下がっていく曲線が描画されるよ。"

  - kind: exercise
    title: "Tensor の自動微分"
    prompt: |
      `f(x) = x^3` の x=2 における微分を PyTorch で計算してください。
      `requires_grad=True` を有効にしてから `backward()` を呼びます。
    code_template: |
      import torch
      x = torch.tensor(2.0, requires_grad={{slot:flag}})
      y = x ** 3
      y.{{slot:method}}()
      print(float(x.grad))
    blanks:
      - id: flag
        canonical_answer: "True"
        accept_patterns: ['^True$']
        hint: "微分を有効にする"
      - id: method
        canonical_answer: "backward"
        accept_patterns: ['^backward$']
        hint: "逆伝播メソッド"
    test_cases:
      - kind: stdout_regex
        pattern: '^12\.0\s*$'
    hints:
      - "`requires_grad=True` と `backward()`。"
      - "`True` と `backward`。"
    stickman_feedback:
      correct: "自動微分、これがディープラーニングの心臓。"
      wrong_hint1: "`True` と `backward`。"
      wrong_hint2: "`True` と `backward`。"
      wrong_hint3: "`True` と `backward`。"

  - kind: exercise
    title: "線形層を組み立てよう"
    prompt: |
      入力 5 次元 → 出力 1 次元の線形層を `nn.Linear(in, out)` で作ってください。
    code_template: |
      import torch
      import torch.nn as nn
      layer = nn.{{slot:cls}}(5, 1)
      x = torch.randn(3, 5)
      y = layer(x)
      print(y.shape)
    blanks:
      - id: cls
        canonical_answer: "Linear"
        accept_patterns: ['^Linear$']
        hint: "全結合層のクラス名"
    test_cases:
      - kind: stdout_regex
        pattern: 'torch\.Size\(\[3, 1\]\)'
    hints:
      - "`Linear`"
      - "`Linear`"
    stickman_feedback:
      correct: "nn.Linear が全結合層の基本ブロック。"
      wrong_hint1: "`Linear`"
      wrong_hint2: "`Linear`"
      wrong_hint3: "`Linear`"

  - kind: exercise
    title: "1 イテレーションの学習ループ"
    prompt: |
      forward → loss → backward → optimizer.step の **基本 4 ステップ** を完成させてください。
    code_template: |
      import torch
      import torch.nn as nn
      torch.manual_seed(0)
      model = nn.Linear(3, 1)
      opt = torch.optim.SGD(model.parameters(), lr=0.01)
      loss_fn = nn.MSELoss()
      X = torch.randn(8, 3)
      y = torch.randn(8, 1)
      pred = model(X)
      loss = loss_fn({{slot:pred}}, {{slot:y}})
      opt.zero_grad()
      loss.{{slot:bw}}()
      opt.{{slot:step}}()
      print(round(float(loss), 3))
    blanks:
      - id: pred
        canonical_answer: "pred"
        accept_patterns: ['^pred$']
      - id: y
        canonical_answer: "y"
        accept_patterns: ['^y$']
      - id: bw
        canonical_answer: "backward"
        accept_patterns: ['^backward$']
      - id: step
        canonical_answer: "step"
        accept_patterns: ['^step$']
    test_cases:
      - kind: stdout_regex
        pattern: '^\d+\.\d+\s*$'
    hints:
      - "`pred`, `y`, `backward`, `step`。"
      - "`pred`, `y`, `backward`, `step`。"
    stickman_feedback:
      correct: "この 4 ステップが、実務でも研究でも変わらない基本。"
      wrong_hint1: "`pred`, `y`, `backward`, `step`。"
      wrong_hint2: "`pred`, `y`, `backward`, `step`。"
      wrong_hint3: "`pred`, `y`, `backward`, `step`。"

  # ─── 参考実装 ①: nn.Module サブクラス標準パターン ────────
  - kind: sample
    title: "参考実装 — nn.Module サブクラスで自前モデル"
    markdown: |
      ## 業界標準: クラスベースのモデル定義

      `nn.Sequential` は手軽ですが、現実のモデル（残差接続、複数入力、条件分岐）には
      **`nn.Module` をサブクラス化** するのが業界標準です。

      **必須メソッド 2 つ**:
      - `__init__`: 層を属性として登録 (`self.fc1 = nn.Linear(...)`)
      - `forward(x)`: 入力 x からの計算フローを書く（`backward` は PyTorch が自動生成）

      下は信用デフォルト予測の 2 層 MLP。`data/credit_default.csv` の特徴量 4 → 隠れ層 16 → 出力 1。
      CPU で 100 epoch でも 1-2 秒で終わります。

      **業界での使い方**:
      - 研究論文の reference implementation は **ほぼ全てこの形式**
      - HuggingFace, torchvision のモデルもサブクラス方式
      - `Sequential` はトイ実装 / 試作用、本番は `Module` サブクラス
    sample_code: |
      import torch
      import torch.nn as nn
      import pandas as pd

      df = pd.read_csv("data/credit_default.csv")
      feats = ["age", "income", "debt_ratio", "n_defaults"]
      X = torch.tensor(df[feats].values, dtype=torch.float32)
      # 標準化 (本来は train のみで統計を取る)
      X = (X - X.mean(dim=0)) / X.std(dim=0)
      y = torch.tensor(df["default"].values, dtype=torch.float32).unsqueeze(1)

      class CreditMLP(nn.Module):
          def __init__(self, in_dim: int = 4, hidden: int = 16) -> None:
              super().__init__()
              self.fc1 = nn.Linear(in_dim, hidden)
              self.fc2 = nn.Linear(hidden, 1)
              self.act = nn.ReLU()

          def forward(self, x: torch.Tensor) -> torch.Tensor:
              h = self.act(self.fc1(x))
              return torch.sigmoid(self.fc2(h))

      torch.manual_seed(0)
      model = CreditMLP()
      opt = torch.optim.Adam(model.parameters(), lr=0.01)
      loss_fn = nn.BCELoss()

      for epoch in range(100):
          opt.zero_grad()
          loss = loss_fn(model(X), y)
          loss.backward()
          opt.step()
          if epoch % 20 == 0:
              acc = ((model(X) > 0.5).float() == y).float().mean().item()
              print(f"epoch {epoch:3d}  loss={float(loss):.4f}  acc={acc:.3f}")
      print("Done.")
    runnable: true
    stickman: explain
    stickman_speech: "nn.Module サブクラス化は研究も実務も全部これ。Sequential はトイ実装用。"

  # ─── 参考実装 ②: train / eval モード と no_grad の使い分け ──
  - kind: sample
    title: "参考実装 — train() / eval() / no_grad() の使い分け"
    markdown: |
      ## 推論時にこれを忘れるとバグる 3 つの API

      | API | 役割 | いつ使う |
      |---|---|---|
      | `model.train()` | Dropout / BatchNorm を **学習モード** に | 学習ループ前 |
      | `model.eval()`  | Dropout / BatchNorm を **推論モード** に | 推論・バリデーション前 |
      | `with torch.no_grad():` | **勾配計算を無効化** | 推論中、メモリ削減 |

      **典型的バグ**: `model.eval()` を忘れると Dropout が推論時にも発火して結果が毎回変わる。
      `torch.no_grad()` を忘れるとメモリを食って GPU で OOM。

      **推論の定石**:
      ```python
      model.eval()
      with torch.no_grad():
          y_pred = model(X_test)
      ```

      この Sample は Dropout 入りの分類器で 「train モード vs eval モード」 の出力差を見せます。
    sample_code: |
      import torch
      import torch.nn as nn

      torch.manual_seed(42)

      class WithDropout(nn.Module):
          def __init__(self) -> None:
              super().__init__()
              self.fc = nn.Linear(4, 4)
              self.drop = nn.Dropout(p=0.5)  # 50% を学習時に落とす

          def forward(self, x: torch.Tensor) -> torch.Tensor:
              return self.drop(self.fc(x))

      model = WithDropout()
      x = torch.ones(1, 4)

      print("--- train() モード (Dropout 発火、毎回違う) ---")
      model.train()
      for _ in range(3):
          print(model(x).detach().numpy().round(3))

      print("\n--- eval() モード (Dropout 無効、再現的) ---")
      model.eval()
      for _ in range(3):
          print(model(x).detach().numpy().round(3))

      print("\n--- no_grad() でメモリと速度を稼ぐ ---")
      model.eval()
      with torch.no_grad():
          y = model(x)
          print("requires_grad =", y.requires_grad)  # → False
    runnable: true
    stickman: explain
    stickman_speech: "推論前に必ず eval() + no_grad()。これを忘れたバグはチーム全体を 1 日溶かす。"
