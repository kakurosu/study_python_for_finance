id: 8
title: "リストとタプル"
phase: A
prerequisites: [7]
learning_goals:
  - "リストの作成、インデックス、スライスができる"
  - "append / pop / sort / len を使える"
  - "タプルとの違いを説明できる"

pages:
  - kind: sample
    title: "リストの基本操作"
    markdown: |
      ## リスト = 順序付きの値の入れ物
      `[]` で囲んで作り、`[i]` で i 番目（0 から）にアクセスします。
      `[a:b]` でスライスすると新しいリストが返ります。
    sample_code: |
      prices = [100, 102, 98, 105, 110]
      print(prices[0])      # 最初
      print(prices[-1])     # 最後
      print(prices[1:4])    # 1〜3 番目（4 は含まない）
      print(len(prices))
    runnable: true
    expected_output: "100\n110\n[102, 98, 105]\n5"
    stickman: explain
    stickman_speech: "インデックスは 0 始まり。-1 は末尾を指すよ。"

  - kind: sample
    title: "リストの更新"
    markdown: |
      ## append / pop / sort
      - `append(x)`: 末尾に追加
      - `pop()`: 末尾を取り出す
      - `sort()`: 昇順に並び替え（破壊的）
      - `sorted(list)`: 並び替えた**新しいリスト**を返す
    sample_code: |
      prices = [100, 102, 98]
      prices.append(110)
      prices.sort()
      print(prices)
    runnable: true
    expected_output: "[98, 100, 102, 110]"
    stickman: explain
    stickman_speech: "sort は元のリストを変える。元を残したいときは sorted を使おう。"

  - kind: exercise
    title: "直近 3 日のリターンを取り出そう"
    prompt: |
      **スライス** は `[開始:終了]` で部分リストを取り出す機能。終了は **含まない** ので注意。

      | 書き方 | 意味 |
      |--------|------|
      | `r[2:5]` | 2 番目から 4 番目まで |
      | `r[:3]` | 先頭から 3 つ |
      | `r[-3:]` | 末尾から 3 つ |
      | `r[::2]` | 1 つ飛ばし |

      時系列データで「**直近 N 件** を取りたい」場面は山ほどあります。マイナスインデックスは末尾起点で `r[-1]` が最終要素。
    code_template: |
      returns = [0.01, -0.02, 0.03, 0.005, -0.01, 0.015]
      last3 = returns[{{slot:slc}}]
      print(last3)
    blanks:
      - id: slc
        placeholder: "スライス"
        width: 8
        accept_patterns:
          - '^-3:$'
          - '^len\(returns\)-3:$'
          - '^3:$'
        canonical_answer: "-3:"
        hint: "後ろから 3 つは [-3:]"
    test_cases:
      - kind: stdout_regex
        pattern: '^\[0\.005, -0\.01, 0\.015\]\s*$'
    hints:
      - "後ろから取るにはマイナスインデックスを使うと簡単。"
      - "`[-3:]` だね。"
    stickman_feedback:
      correct: "スライスはデータ分析で頻出！"
      wrong_hint1: "マイナスインデックスを使ってみよう。"
      wrong_hint2: "`-3:` だね。"
      wrong_hint3: "答えは `-3:`。"

  - kind: exercise
    title: "新しいリターンをリストに追加しよう"
    prompt: |
      リストの主要メソッド:
      - `append(x)` — **末尾に追加**（最頻出）
      - `pop()` — 末尾を取り出して削除
      - `insert(i, x)` — i 番目に挿入
      - `extend(other)` — 別リストの全要素を追加
      - `remove(x)` — 値 x を 1 つ削除

      ストリーミングデータを順次蓄積するのは `append` の典型的なユースケース。新しい値をどんどん末尾に追加していき、後で集計します。
    code_template: |
      returns = [0.01, -0.02, 0.03]
      returns.{{slot:method}}(0.02)
      print(returns)
    blanks:
      - id: method
        placeholder: "メソッド名"
        width: 10
        accept_patterns:
          - '^append$'
        canonical_answer: "append"
        hint: "末尾に追加するメソッド"
    test_cases:
      - kind: stdout_regex
        pattern: '^\[0\.01, -0\.02, 0\.03, 0\.02\]\s*$'
    hints:
      - "末尾に追加するのは append。"
      - "`append` を入れてね。"
    stickman_feedback:
      correct: "リストの動的な拡張は append が基本！"
      wrong_hint1: "末尾に追加 = append。"
      wrong_hint2: "`append` だね。"
      wrong_hint3: "答えは `append`。"

  # ─── 参考実装: ポートフォリオ重みリストの正規化 ──────────
  - kind: sample
    title: "参考実装 — リストでポートフォリオ重みを正規化"
    markdown: |
      ## 「合計を 1.0 にする」が最初の処理

      ポートフォリオ最適化や許容ウェイトの調整で、**重みを 1 にスケール** する作業は頻出。
      リストの基本操作 (合計、内包、スライス) だけで書けます。

      **典型的な状況**:
      - アナリストが「AAPL 30, MSFT 25, GOOG 25, AMZN 20」と言ったら
        合計 100 → 各値 / 100 で正規化
      - 「上位 5 銘柄だけに集中」したいなら、`sorted` + スライス + 再正規化
      - 「マイナス重み (= 空売り)」を許すかどうかは戦略次第 (ロングオンリーなら絶対値→正規化)

      **小ネタ**:
      - SUM != 1 のまま渡すと最適化ライブラリがエラーや誤動作
      - 浮動小数点誤差で 0.99999... になることもあり、`assert abs(sum-1) < 1e-9` で確認
      - tuple は **immutable** なので「確定したポート」を保存するのに向く
    sample_code: |
      raw = [30.0, 25.0, 25.0, 20.0, 10.0, 5.0]   # 合計 115 (1 に揃ってない)
      tickers = ["AAPL", "MSFT", "GOOG", "AMZN", "META", "NVDA"]

      # 1) 単純正規化
      total = sum(raw)
      weights = [r / total for r in raw]
      print(f"正規化前合計: {total},  正規化後合計: {sum(weights):.6f}")
      for t, w in zip(tickers, weights):
          print(f"  {t}: {w*100:5.2f}%")

      # 2) 上位 N 銘柄だけに集中して再正規化
      N = 3
      pairs = sorted(zip(tickers, weights), key=lambda p: -p[1])[:N]
      top_tickers, top_w = zip(*pairs)
      total2 = sum(top_w)
      concentrated = [w / total2 for w in top_w]
      print(f"\n上位 {N} 銘柄に集中:")
      for t, w in zip(top_tickers, concentrated):
          print(f"  {t}: {w*100:5.2f}%")

      # 3) 確定ポートを tuple で保存 (immutable = 後から間違って書き換えない)
      final_portfolio = tuple(zip(top_tickers, concentrated))
      print(f"\n確定ポート (tuple): {final_portfolio}")
    runnable: true
    stickman: explain
    stickman_speech: "リストは「途中で形が変わる作業中の入れ物」、tuple は「確定したものを置く金庫」。"
