learning_goals:
- 期待値・分散・共分散・シャープレシオの計算コードを読み解ける
- ポートフォリオ最適化とモンテカルロのコード構造を理解する
pages:
- kind: reading
  title: 期待値の計算（章 17 復習）
  prompt: |
    **この問題の文法ポイント**

    - 期待値は $E[R] = \sum_i p_i \cdot r_i$ (確率重み付き平均)。
    - NumPy では `(probs * returns).sum()` で 1 行。
    - 確率 `probs` は合計 1 でなければならない (確認: `probs.sum() == 1.0`)。

    **読み方**: 「シナリオごとの確率 × リターン」を足し合わせる、と公式どおりに計算。

    ---

    下のコードの `expected` の値として正しいものを選んでください。
  code: |
    import numpy as np
    probs = np.array([0.3, 0.5, 0.2])
    returns = np.array([0.10, 0.05, -0.10])
    expected = (probs * returns).sum()
    print(round(expected, 4))
  code_file_label: q01.py
  choices:
  - '0.0350'
  - '0.0500'
  - '0.0167'
  - '0.0100'
  correct_index: 0
  explanation: |-
    期待値 $\mathbb{E}[R] = \sum_i p_i \cdot r_i = 0.3 \times 0.10 + 0.5 \times 0.05 + 0.2 \times (-0.10) = 0.03 + 0.025 - 0.02 = 0.035$。

    **ありがちな誤り**: 年率換算で √12 を忘れる、`ddof=0/1` の取り違え、リターンと価格の混同。**実務でも頻出**なので一度紙で導出を追ってみましょう。
    **詳しくは**: 章 17 を再確認してください。
- kind: reading
  title: 分散と標準偏差（章 17 復習）
  prompt: |
    **この問題の文法ポイント**

    - `np.std(arr, ddof=1)` は **不偏標準偏差** ((n-1) で割る、サンプル統計)。
    - `ddof=0` は母分散ベース (n で割る)、Python 既定。
    - 金融データは「サンプルから母集団を推測」する場面が多いので `ddof=1` を使うのが業界標準。

    **読み方**: `ddof=1` を見たら **不偏 (= サンプル統計)** と判定。

    ---

    下のコードが計算している指標は何ですか？
  code: |
    import numpy as np
    returns = np.array([0.10, -0.05, 0.08, 0.03, -0.02])
    result = np.std(returns, ddof=1)
    print(result)
  code_file_label: q02.py
  choices:
  - リターンの算術平均
  - リターンの母標準偏差（n で割る）
  - リターンの不偏標準偏差（n-1 で割る）
  - リターンの最大値
  correct_index: 2
  explanation: |-
    `np.std(..., ddof=1)` は自由度 (n-1) で割る **不偏標準偏差**。サンプル分散の平方根に相当し、統計分析でよく使われます。`ddof=0`（デフォルト）は母標準偏差です。

    **ありがちな誤り**: 年率換算で √12 を忘れる、`ddof=0/1` の取り違え、リターンと価格の混同。**実務でも頻出**なので一度紙で導出を追ってみましょう。
    **詳しくは**: 章 17 を再確認してください。
- kind: reading
  title: 共分散行列の対角成分（章 18 復習）
  prompt: |
    **この問題の文法ポイント**

    - `np.cov(a, b, ddof=1)` は **2 列の共分散行列** (2x2) を返す。
    - 対角成分 `cov[0,0]`, `cov[1,1]` はそれぞれ **a の分散**、**b の分散**。
    - 非対角 `cov[0,1] == cov[1,0]` は a と b の **共分散**。

    **読み方**: 行と列が同じ index の場所は「自分の分散」、違うところは「他との関係」と覚える。

    ---

    下のコードの `cov[0, 0]` の意味として正しいものを選んでください。
  code: |
    import numpy as np
    cov = np.cov(returns_a, returns_b, ddof=1)
    print(cov[0, 0])
  code_file_label: q03.py
  choices:
  - ファンド A とファンド B の共分散
  - ファンド A 自身の分散（不偏）
  - ファンド B 自身の分散（不偏）
  - ファンド A と B の相関係数
  correct_index: 1
  explanation: |-
    `np.cov` は 2×2 の共分散行列を返します。対角成分 `cov[0,0]` は **1 番目の系列（A）の分散**、`cov[1,1]` は B の分散、`cov[0,1] = cov[1,0]` が A と B の共分散です。

    **ありがちな誤り**: 年率換算で √12 を忘れる、`ddof=0/1` の取り違え、リターンと価格の混同。**実務でも頻出**なので一度紙で導出を追ってみましょう。
    **詳しくは**: 章 18 を再確認してください。
- kind: reading
  title: 相関係数の計算（章 18 復習）
  prompt: |
    **この問題の文法ポイント**

    - 相関係数は $\rho = \dfrac{\mathrm{Cov}(a,b)}{\sigma_a \sigma_b}$ で計算。
    - 共分散を **各々の標準偏差の積** で割ると、$-1 \le \rho \le 1$ にスケールされる。
    - `np.corrcoef(a, b)` でも同じ結果が得られる。

    **読み方**: 共分散行列の非対角を、対角の平方根の積で割る、と公式を追う。

    ---

    下のコードについて、`corr` が取り得る値の範囲として正しいものを選んでください。
  code: |
    import numpy as np
    cov = np.cov(a, b, ddof=1)
    corr = cov[0, 1] / (np.std(a, ddof=1) * np.std(b, ddof=1))
  code_file_label: q04.py
  choices:
  - 0 〜 1 の範囲
  - -1 〜 1 の範囲
  - 0 以上の任意の値
  - 任意の実数
  correct_index: 1
  explanation: |-
    相関係数 $\rho = \dfrac{\mathrm{Cov}(a, b)}{\sigma_a \sigma_b}$ は定義により $-1 \le \rho \le +1$ の範囲。$+1$ は完全正の相関、$-1$ は完全負の相関、$0$ は無相関を意味します。

    **ありがちな誤り**: 年率換算で √12 を忘れる、`ddof=0/1` の取り違え、リターンと価格の混同。**実務でも頻出**なので一度紙で導出を追ってみましょう。
    **詳しくは**: 章 18 を再確認してください。
- kind: reading
  title: シャープレシオの式（章 19 復習）
  prompt: |
    **この問題の文法ポイント**

    - シャープレシオ = $\dfrac{\mu_p - r_f}{\sigma_p}$ (超過リターン ÷ リターンの標準偏差)。
    - 「リスク 1 単位あたりの超過リターン」を測る業界標準指標。
    - 月次データから年率化するには **μ は ×12、σ は ×√12**。年率化した σ を「ボラティリティ」と呼ぶ。

    **読み方**: 「超過リターンの平均」を「標準偏差（年率ではボラティリティ）」で割る、というシンプルな比率と捉える。

    ---

    下のコードは何の指標を計算しているか選んでください。
  code: |
    import numpy as np
    excess = returns - risk_free
    ratio = excess.mean() / excess.std(ddof=1)
    annualized = ratio * np.sqrt(12)
    print(annualized)
  code_file_label: q05.py
  choices:
  - 年率化したシャープレシオ
  - 年率化したインフォメーションレシオ
  - 年率化したトラッキングエラー
  - ベンチマーク調整リターン
  correct_index: 0
  explanation: |-
    $\dfrac{R_p - R_f}{\sigma_p}$ を月次で計算し $\sqrt{12}$ を掛けて年率化しているのは **シャープレシオ**。IR はベンチマーク超過リターンを TE で割ったもの、TE は超過リターンの標準偏差そのものです。

    **ありがちな誤り**: 年率換算で √12 を忘れる、`ddof=0/1` の取り違え、リターンと価格の混同。**実務でも頻出**なので一度紙で導出を追ってみましょう。
    **詳しくは**: 章 19 を再確認してください。
- kind: reading
  title: IR の定義（章 19 復習）
  prompt: |
    **この問題の文法ポイント**

    - インフォメーションレシオ (IR) = $\dfrac{\mu_a - \mu_b}{\sigma(r_a - r_b)}$ (アクティブリターン ÷ トラッキングエラー)。
    - ベンチマーク **対比** で測るのでアクティブ運用評価の標準指標。
    - 分母は **アクティブリターン（差分系列）の標準偏差**。ポートフォリオ全体の標準偏差ではない点に注意。

    **読み方**: 「対ベンチの差分系列」の平均と std を取って割る、と読む。

    ---

    下のコードの `ir` が表す指標として正しいものを選んでください。
  code: |
    active = fund_returns - bench_returns
    ir = active.mean() / active.std(ddof=1)
  code_file_label: q06.py
  choices:
  - シャープレシオ
  - インフォメーションレシオ
  - ソルティーノレシオ
  - アルファ
  correct_index: 1
  explanation: |-
    ベンチマーク超過リターン（active return）の平均をその標準偏差（トラッキングエラー）で割ったものが **インフォメーションレシオ**。マネージャーのスキル指標です。

    **ありがちな誤り**: 年率換算で √12 を忘れる、`ddof=0/1` の取り違え、リターンと価格の混同。**実務でも頻出**なので一度紙で導出を追ってみましょう。
    **詳しくは**: 章 19 を再確認してください。
- kind: reading
  title: 等加重ポートフォリオ（章 20 復習）
  prompt: |
    **この問題の文法ポイント**

    - 等加重ポートフォリオは **全資産を同じ比率で持つ** 最もシンプルな戦略。
    - `np.ones(n) / n` で n 個の `1/n` のベクトルが作れる (合計は 1)。
    - Markowitz 最適化の **ベースライン比較** によく使われる。

    **読み方**: 配列の要素数と中身を見て「全部同じ値」になっているか確認。

    ---

    下のコードが構築しているポートフォリオの重み配分として正しいものを選んでください。
  code: |
    import numpy as np
    n = 4
    w = np.ones(n) / n
    print(w)
  code_file_label: q07.py
  choices:
  - '[1, 1, 1, 1]'
  - '[0.25, 0.25, 0.25, 0.25]'
  - '[1.0, 0.5, 0.25, 0.125]'
  - '[4, 4, 4, 4]'
  correct_index: 1
  explanation: |-
    `np.ones(4)` は `[1, 1, 1, 1]`、それを 4 で割って `[0.25, 0.25, 0.25, 0.25]`。これは **等加重ポートフォリオ**（equal-weight）の典型実装です。

    **ありがちな誤り**: 年率換算で √12 を忘れる、`ddof=0/1` の取り違え、リターンと価格の混同。**実務でも頻出**なので一度紙で導出を追ってみましょう。
    **詳しくは**: 章 20 を再確認してください。
- kind: reading
  title: ポートフォリオ分散の計算（章 20 復習）
  prompt: |
    **この問題の文法ポイント**

    - ポートフォリオ分散は $\sigma_p^2 = \mathbf{w}^\top \Sigma \mathbf{w}$ (重みベクトル × 共分散 × 重みベクトル)。
    - NumPy では `w @ cov @ w` で 1 行 (`@` は行列積演算子)。
    - 結果は **スカラー (1 個の数)**、これの平方根がポートフォリオの標準偏差（年率なら ボラティリティ）。

    **読み方**: 行列積を左から順に「w・cov → ベクトル」「そのベクトル・w → スカラー」と追う。

    ---

    下のコードが計算しているのは何ですか？
  code: |
    import numpy as np
    port_var = w @ cov @ w
  code_file_label: q08.py
  choices:
  - ポートフォリオの期待リターン
  - ポートフォリオの分散（σ_p²）
  - ポートフォリオの標準偏差（σ_p）
  - ポートフォリオのシャープレシオ
  correct_index: 1
  explanation: |-
    $\mathbf{w}^\top \Sigma\, \mathbf{w}$ はベクトル $\mathbf{w}$ と共分散行列 $\Sigma$ の二次形式で、ポートフォリオの **分散 $\sigma_p^2$** を与える式です。標準偏差を得るには `np.sqrt(w @ cov @ w)`。

    **ありがちな誤り**: 年率換算で √12 を忘れる、`ddof=0/1` の取り違え、リターンと価格の混同。**実務でも頻出**なので一度紙で導出を追ってみましょう。
    **詳しくは**: 章 20 を再確認してください。
- kind: reading
  title: モンテカルロ・シミュレーション（章 21 復習）
  prompt: |
    **この問題の文法ポイント**

    - `np.random.default_rng(seed)` で **乱数生成器** を作る。同じ seed なら結果再現可。
    - `.standard_normal(n)` で標準正規分布 (μ=0, σ=1) から n 個サンプル。
    - モンテカルロは「乱数を多数回振って平均を取る」近似法の総称。

    **読み方**: `seed=0` で乱数を固定して、生成された配列の形 (shape) を確認。

    ---

    下のコードは何を計算しているか選んでください。
  code: |
    import numpy as np
    rng = np.random.default_rng(0)
    paths = rng.normal(0.0, 0.01, size=(1000, 252))
    terminal = (1 + paths).prod(axis=1)
    print(terminal.mean())
  code_file_label: q09.py
  choices:
  - 1000 銘柄の同時最適化
  - 1000 本の 252 日リターン経路を生成し、各経路の累積リターンの平均を出す
  - リターンの自己相関係数
  - VaR（バリュー・アット・リスク）
  correct_index: 1
  explanation: |-
    正規乱数を 1000×252 個生成 → 各経路で `(1+r)` を順次掛けて 252 日後の累積リターンを得る → その平均。**モンテカルロ法** による期待ターミナル価値の推定です。

    **ありがちな誤り**: 年率換算で √12 を忘れる、`ddof=0/1` の取り違え、リターンと価格の混同。**実務でも頻出**なので一度紙で導出を追ってみましょう。
    **詳しくは**: 章 21 を再確認してください。
- kind: reading
  title: GBM の対数収益（章 21 復習）
  prompt: |
    **この問題の文法ポイント**

    - GBM の対数収益は $\log\dfrac{S_{t+dt}}{S_t} = (\mu - \tfrac{\sigma^2}{2}) dt + \sigma\sqrt{dt}\,Z$。
    - ドリフト項に **$-\sigma^2/2$ の補正** が入る (伊藤の補題から)。これを忘れると価格期待値がずれる。
    - 累積和を `exp` すると価格パスになる。

    **読み方**: 公式の各項 (ドリフト・分散補正・拡散) を 1 つずつコードと対応付ける。

    ---

    下のコードの `S` が表すものとして最も適切なのは？
  code: |
    import numpy as np
    n = 252
    mu, sigma = 0.05, 0.20
    dt = 1 / n
    z = np.random.default_rng(0).standard_normal(n)
    log_ret = (mu - 0.5 * sigma ** 2) * dt + sigma * np.sqrt(dt) * z
    S = 100 * np.exp(log_ret.cumsum())
  code_file_label: q10.py
  choices:
  - 幾何ブラウン運動による 1 本の株価経路
  - ベンチマーク・インデックスの実データ
  - VaR の信頼区間
  - ポートフォリオの最適化結果
  correct_index: 0
  explanation: |-
    $\bigl(\mu - \tfrac{\sigma^2}{2}\bigr) dt + \sigma\sqrt{dt}\, Z$ は **GBM の対数収益の離散化**。これを累積和した指数を初期株価 100 に掛けて、株価の 1 本のサンプルパスを生成しています。

    **ありがちな誤り**: 年率換算で √12 を忘れる、`ddof=0/1` の取り違え、リターンと価格の混同。**実務でも頻出**なので一度紙で導出を追ってみましょう。
    **詳しくは**: 章 21 を再確認してください。
