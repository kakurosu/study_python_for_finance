id: 3
title: "演算と代入"
phase: A
prerequisites: [2]
learning_goals:
  - "四則演算 (+ - * /)、整数除算 (//)、剰余 (%)、べき乗 (**) を使える"
  - "複合代入演算子 (+=, -=, *=, /=) を使える"

pages:
  - kind: sample
    title: "演算子いろいろ"
    markdown: |
      ## 数値演算
      Python の数値演算は普通の数学とほぼ同じです。
      | 記号 | 意味 |
      |------|------|
      | `+` `-` `*` `/` | 加減乗除 |
      | `//` | 整数除算（小数を切り捨て） |
      | `%` | 剰余（余り） |
      | `**` | べき乗 |
    sample_code: |
      print(7 + 3)
      print(7 / 2)
      print(7 // 2)
      print(7 % 2)
      print(2 ** 10)
    runnable: true
    expected_output: "10\n3.5\n3\n1\n1024"
    stickman: explain
    stickman_speech: "// と % は意外と便利だよ。"

  - kind: exercise
    title: "売上の年率成長率を計算しよう"
    prompt: |
      **CAGR（年平均成長率）** は `(終値/始値)^(1/n) - 1` で計算します（n は年数）。
      2 年で 100 → 121 になった場合、`(121/100)^(1/2) - 1 = 0.10` で **年率 10%**。

      Python では **べき乗** に `**` を使い、平方根は `** 0.5` と書けます（`** (1/2)` でも OK）。

      下の式の空欄を埋めて、年率成長率（小数 4 桁丸め）を表示しよう。「複利平均成長率（CAGR）」と呼ばれる、金融実務で頻出の式です。
    code_template: |
      start = 100
      end = 121
      growth_rate = (end / start) {{slot:expr}} - 1
      print(round(growth_rate, 4))
    blanks:
      - id: expr
        placeholder: "演算子と数"
        width: 12
        accept_patterns:
          - '^\*\*\s*0\.5$'
          - '^\*\*\s*\(1\s*/\s*2\)$'
        canonical_answer: "** 0.5"
        hint: "平方根は ** 0.5"
    test_cases:
      - kind: stdout_regex
        pattern: '^0\.1\s*$'
    hints:
      - "平方根は 0.5 乗と同じ。`** 0.5` を使うよ。"
      - "`** 0.5` を入れてみて。"
    stickman_feedback:
      correct: "金融では √ がよく出てくるよ！"
      wrong_hint1: "べき乗演算子は ** だよ。"
      wrong_hint2: "0.5 乗が平方根だね。"
      wrong_hint3: "`** 0.5` を入れてね。"

  - kind: exercise
    title: "複合代入で集計しよう"
    prompt: |
      **複合代入演算子** は `a = a + b` を `a += b` と短く書ける記法です。`-=` `*=` `/=` も同様。

      ```python
      total = 0
      total = total + 100   # 普通の書き方
      total += 100          # 複合代入（同じ意味）
      ```

      ループ内の **アキュムレータ** （累積変数）でほぼ必ず使う書き方なので、今のうちに覚えておきましょう。

      下のループを完成させて `sales` の合計（750）を表示しよう。
    code_template: |
      sales = [100, 200, 150, 300]
      total = 0
      for s in sales:
          total {{slot:op}} s
      print(total)
    blanks:
      - id: op
        placeholder: "演算子"
        width: 8
        accept_patterns:
          - '^\+=$'
        canonical_answer: "+="
        hint: "「現在の値に右辺を足す」 += を使う"
    test_cases:
      - kind: stdout_regex
        pattern: '^750\s*$'
      - kind: namespace_check
        asserts:
          - "total == 750"
    hints:
      - "`a += b` は `a = a + b` と同じ意味だよ。"
      - "`+=` を入れてみて。"
    stickman_feedback:
      correct: "複合代入はコードがすっきりするね！"
      wrong_hint1: "「足してから代入」する演算子だよ。"
      wrong_hint2: "`+=` だね。"
      wrong_hint3: "答えは `+=`。"

  # ─── 参考実装: 単利 / 複利 / 実効年率 1 行集 ─────────────
  - kind: sample
    title: "参考実装 — 単利 / 複利 / 実効年率の 1 行計算集"
    markdown: |
      ## 金利の世界の 4 大計算

      | 名称 | 数式 | 例 |
      |---|---|---|
      | 単利 (Simple) | $A = P (1 + r \cdot n)$ | 100 万円・3%・5 年 → 115 万円 |
      | 複利 (Compound, 年複利) | $A = P (1 + r)^n$ | 同条件 → 115.93 万円 |
      | 連続複利 (Continuous) | $A = P \cdot e^{rn}$ | 同条件 → 116.18 万円 |
      | 実効年率 (EAR) | $\text{EAR} = (1 + r/m)^m - 1$ | r=12% を月次複利 → 12.68% |

      **業界での使い分け**:
      - **預金・債券**: ほとんど複利 (年・半期・月複利)
      - **ローン**: 月複利 (Effective Annual Rate を表示義務)
      - **オプション理論・派生商品**: 連続複利が標準
      - **会計上の利息計算**: 単利が多い (規制で定められる)

      **長期投資の感覚**: 利率が `r%` なら **元本 2 倍になる年数 ≈ 72 / r** (72 の法則)。
      r=6% → 12 年、r=3% → 24 年。
    sample_code: |
      import math

      P = 1_000_000     # 元金 100 万円
      r = 0.03          # 年率 3%
      n = 5             # 5 年

      simple   = P * (1 + r * n)
      compound = P * (1 + r) ** n
      continuous = P * math.exp(r * n)
      print(f"単利       : {simple:>12,.0f} 円")
      print(f"複利       : {compound:>12,.0f} 円")
      print(f"連続複利   : {continuous:>12,.0f} 円")

      print(f"\n72 の法則: r=3% で元本 2 倍は約 {72 / 3:.0f} 年")

      # 実効年率: r=12% を様々な複利頻度で
      r_apr = 0.12
      for m, name in [(1, "年複利"), (2, "半期複利"), (12, "月複利"), (365, "日複利")]:
          ear = (1 + r_apr / m) ** m - 1
          print(f"APR 12% → {name:8s}: EAR = {ear * 100:.4f}%")
    runnable: true
    stickman: explain
    stickman_speech: "金利のバリエーション全部、結局この 4 つに収まる。覚えてしまえば派生商品も怖くない。"
