id: 18
title: "共分散・相関・トラッキングエラー"
phase: C
prerequisites: [17]
learning_goals:
  - "共分散と相関の関係を理解する"
  - "`np.cov` と `np.corrcoef` を使い分ける"
  - "トラッキングエラー TE = σ(r_p − r_b) を計算できる"

pages:
  - kind: sample
    title: "共分散と相関"
    markdown: |
      ## 2 つの系列の関係性

      **共分散** — 単位は X と Y の積:

      $$ \mathrm{Cov}(X, Y) = \mathbb{E}\bigl[(X - \mu_X)(Y - \mu_Y)\bigr] $$

      ここで:
      - $X, Y$ : 2 つの確率変数（リターン系列など）
      - $\mu_X = \mathbb{E}[X]$ : $X$ の期待値
      - $\mu_Y = \mathbb{E}[Y]$ : $Y$ の期待値
      - $\mathbb{E}[\cdot]$ : 期待値演算子

      **相関係数** — 共分散を標準偏差の積で割って $[-1, +1]$ にスケール (単位なし):

      $$ \mathrm{Corr}(X, Y) = \rho_{XY} = \dfrac{\mathrm{Cov}(X, Y)}{\sigma_X \sigma_Y} $$

      ここで:
      - $\rho_{XY}$ : $X$ と $Y$ のピアソン相関係数 ($-1 \le \rho_{XY} \le 1$)
      - $\sigma_X, \sigma_Y$ : それぞれの標準偏差

      共分散行列・相関行列は `np.cov` / `np.corrcoef` で一発計算できます。
    sample_code: |
      import numpy as np
      a = np.array([0.01, -0.02, 0.005, 0.012, -0.008])
      b = np.array([0.008, -0.015, 0.004, 0.010, -0.005])
      cov_mat = np.cov(a, b, ddof=1)
      corr_mat = np.corrcoef(a, b)
      print("Cov(a,b)  =", round(cov_mat[0, 1], 6))
      print("Corr(a,b) =", round(corr_mat[0, 1], 4))
    runnable: true
    stickman: explain
    stickman_speech: "相関 +1 = 完全に同じ向きに動くということ。"

  - kind: sample
    title: "トラッキングエラーとは"
    markdown: |
      ## Tracking Error = アクティブリターンの標準偏差（年率）

      ファンドリターン $r_p$ とベンチマーク $r_b$ の差を **アクティブリターン** と呼びます:

      $$ \alpha_t = r_p(t) - r_b(t) $$

      ここで:
      - $r_p(t)$ : ポートフォリオ（ファンド）の時点 $t$ におけるリターン (portfolio return)
      - $r_b(t)$ : ベンチマーク (benchmark) の時点 $t$ におけるリターン
      - $\alpha_t$ : 時点 $t$ のアクティブリターン（ベンチからの超過分）

      その **標準偏差** を年率換算したものが **トラッキングエラー (TE)**（年率ボラティリティ）:

      $$ \text{TE} = \sigma(r_p - r_b) \times \sqrt{252} $$

      ここで:
      - $\sigma(r_p - r_b)$ : 日次（あるいは元の頻度の）アクティブリターン $\alpha_t$ の標準偏差（不偏推定 ddof=1）
      - $\sqrt{252}$ : 日次→年率の標準偏差換算係数（月次なら $\sqrt{12}$）
      - $\text{TE}$ : 年率トラッキングエラー (単位は元のリターンと同じ、通常 % 表示)

      アクティブ運用の「ベンチマークからの逸脱の大きさ」を測る指標で、
      インフォメーション・レシオ (IR) の **分母** にもなります (次章)。
    sample_code: |
      import numpy as np
      rp = np.array([0.012, -0.018, 0.005, 0.015, -0.007])
      rb = np.array([0.010, -0.015, 0.004, 0.012, -0.005])
      active = rp - rb
      te_annual = active.std(ddof=1) * np.sqrt(252)
      print("TE (年率):", round(te_annual, 4))
    runnable: true
    stickman: explain
    stickman_speech: "TE は「ベンチマークからどれだけずれた」を測る大事な指標！"

  - kind: exercise
    title: "共分散を計算しよう"
    prompt: |
      `a` と `b` の共分散（不偏推定 ddof=1）を計算してください。
      `np.cov` の戻り値は 2×2 行列なので、`[0, 1]` の値が共分散です。
    code_template: |
      import numpy as np
      a = np.array([0.01, -0.02, 0.005, 0.012, -0.008])
      b = np.array([0.008, -0.015, 0.004, 0.010, -0.005])
      cov_ab = np.{{slot:fn}}(a, b, ddof=1)[0, 1]
      print(round(float(cov_ab), 6))
    blanks:
      - id: fn
        canonical_answer: "cov"
        accept_patterns: ['^cov$']
        hint: "共分散関数"
    test_cases:
      - kind: stdout_regex
        pattern: '^0\.00014\s*$'
    hints:
      - "共分散関数は np.cov。"
      - "`cov`"
    stickman_feedback:
      correct: "共分散はポートフォリオ理論の基礎！"
      wrong_hint1: "`cov`"
      wrong_hint2: "`cov`"
      wrong_hint3: "`cov`"

  - kind: exercise
    title: "相関係数を計算しよう"
    prompt: |
      同じ `a`, `b` の相関係数を計算してください。
    code_template: |
      import numpy as np
      a = np.array([0.01, -0.02, 0.005, 0.012, -0.008])
      b = np.array([0.008, -0.015, 0.004, 0.010, -0.005])
      corr_ab = np.{{slot:fn}}(a, b)[0, 1]
      print(round(float(corr_ab), 4))
    blanks:
      - id: fn
        canonical_answer: "corrcoef"
        accept_patterns: ['^corrcoef$']
        hint: "相関係数の関数名"
    test_cases:
      - kind: stdout_regex
        pattern: '^0\.9993\s*$'
    hints:
      - "相関は np.corrcoef。"
      - "`corrcoef`"
    stickman_feedback:
      correct: "相関 ≒ 1 で 2 銘柄はほぼ同じ動きだね！"
      wrong_hint1: "`corrcoef`"
      wrong_hint2: "`corrcoef`"
      wrong_hint3: "`corrcoef`"

  - kind: exercise
    title: "トラッキングエラーを計算しよう"
    prompt: |
      ファンドリターン `rp` とベンチマーク `rb` から年率トラッキングエラーを計算してください。
    code_template: |
      import numpy as np
      rp = np.array([0.012, -0.018, 0.005, 0.015, -0.007])
      rb = np.array([0.010, -0.015, 0.004, 0.012, -0.005])
      active = {{slot:diff}}
      te = active.std(ddof=1) * np.sqrt(252)
      print(round(float(te), 4))
    blanks:
      - id: diff
        canonical_answer: "rp - rb"
        accept_patterns:
          - '^rp\s*-\s*rb$'
        hint: "アクティブリターン = ファンド − ベンチ"
    test_cases:
      - kind: stdout_regex
        pattern: '^0\.0411\s*$'
    hints:
      - "アクティブリターン = rp - rb。"
      - "`rp - rb`"
    stickman_feedback:
      correct: "アクティブ運用の評価指標、TE！"
      wrong_hint1: "`rp - rb`"
      wrong_hint2: "`rp - rb`"
      wrong_hint3: "`rp - rb`"

  # ─── 参考実装 ①: 相関行列のヒートマップで一望する ──────────
  - kind: sample
    title: "参考実装 — 相関行列のヒートマップ"
    markdown: |
      ## 6 資産の相関構造を一望する

      実務では 5-20 資産の相関行列を **ヒートマップ** で見るのが定番。
      色の濃さ = 相関の強さ。**対角は必ず 1.0**、対称行列なので上三角と下三角は同じ。

      **読み方の例**:
      - 株式同士: 相関 **0.6-0.9** → 同じリスクファクター（市場）に晒されている
      - 株 vs 債券: **-0.3 〜 +0.3** → 分散効果が出やすい
      - コモディティ (金など): 他資産と低相関 → ヘッジ資産として組み入れる根拠

      数式: $\rho_{ij} = \dfrac{\mathrm{Cov}(r_i, r_j)}{\sigma_i \sigma_j}$ で常に $-1 \le \rho \le 1$。

      **注意点**: 相関は **線形** な依存しか測れない。非線形（裾依存・テイル相関）は別指標が必要。
      暴落時には「平時の相関」が崩れて全資産がいっせいに下がる、というのも有名な現象。
    sample_code: |
      import pandas as pd
      import matplotlib.pyplot as plt

      df = pd.read_csv("data/returns_monthly.csv", index_col="YearMonth")
      corr = df.corr()
      print(corr.round(2))

      fig, ax = plt.subplots(figsize=(6.5, 5.5))
      im = ax.imshow(corr, cmap="RdBu_r", vmin=-1, vmax=1)
      ax.set_xticks(range(len(corr.columns)))
      ax.set_yticks(range(len(corr.columns)))
      ax.set_xticklabels(corr.columns, rotation=45, ha="right")
      ax.set_yticklabels(corr.columns)
      for i in range(len(corr)):
          for j in range(len(corr)):
              v = corr.iloc[i, j]
              ax.text(j, i, f"{v:.2f}", ha="center", va="center",
                      color="white" if abs(v) > 0.5 else "black", fontsize=10)
      fig.colorbar(im, ax=ax, fraction=0.046)
      ax.set_title("Asset Correlation Matrix (monthly returns)")
      fig.tight_layout()
      plt.show()
    runnable: true
    stickman: explain
    stickman_speech: "ヒートマップで一望すると、分散効果のある資産ペアが見えてくる。"

  # ─── 参考実装 ②: 分散共分散とリスク分解 (component contribution) ──
  - kind: sample
    title: "参考実装 — ポートフォリオ分散とリスク分解"
    markdown: |
      ## 「誰がリスクを持ち込んでいるか」を見る

      ポートフォリオ分散は次の形:

      $$ \sigma_p^2 = \mathbf{w}^\top \Sigma \mathbf{w} $$

      ここから **各資産の限界寄与 (marginal contribution)** と **成分寄与 (component contribution)** を分解できます。

      - 限界寄与: $\mathrm{MCR}_i = \dfrac{\partial \sigma_p}{\partial w_i} = \dfrac{(\Sigma \mathbf{w})_i}{\sigma_p}$
      - 成分寄与: $\mathrm{CR}_i = w_i \times \mathrm{MCR}_i$、総和は $\sigma_p$ に等しい

      実務での意義:
      - 「**ウェイトは 5%** だが **リスク寄与は 25%**」のような偏りを発見できる
      - **リスクパリティ** はこの寄与を全資産で均等化する戦略 (章 20 で扱う)
      - **Component VaR** という業界標準のリスクモニタの入口

      この Sample は等加重 (1/N) ポートフォリオで分解してみます。
    sample_code: |
      import numpy as np
      import pandas as pd

      df = pd.read_csv("data/returns_monthly.csv", index_col="YearMonth")
      # 年率の共分散行列
      cov_ann = df.cov() * 12
      assets = cov_ann.columns.tolist()
      n = len(assets)

      # 等加重
      w = np.ones(n) / n
      port_var = float(w @ cov_ann.values @ w)
      port_vol = port_var ** 0.5
      print(f"Equal-weight portfolio annual vol (年率ボラティリティ) = {port_vol:.4f}")

      # リスク分解
      mcr = (cov_ann.values @ w) / port_vol   # marginal contribution
      cr  = w * mcr                            # component contribution
      pct = cr / port_vol * 100

      out = pd.DataFrame({
          "weight":   np.round(w, 4),
          "MCR":      np.round(mcr, 4),
          "Component": np.round(cr, 4),
          "RiskPct%": np.round(pct, 2),
      }, index=assets)
      print(out)
      print(f"sum(Component) = {cr.sum():.4f}  (== port_vol = {port_vol:.4f})")
    runnable: true
    expected_output: "Equal-weight"
    stickman: explain
    stickman_speech: "ウェイトとリスク寄与は別物。ここを意識するとリスク管理の解像度が上がる。"
