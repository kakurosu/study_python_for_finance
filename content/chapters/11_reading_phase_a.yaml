learning_goals:
- Phase A で学んだ文法（変数・演算・if・ループ・リスト・辞書・関数）を読み解ける
- コードを実行せずに、出力や挙動を頭の中で追える
pages:
- kind: reading
  title: print の基本（章 01 復習）
  prompt: |
    **この問題の文法ポイント**

    - `print(...)` は値を **画面に出力** する組み込み関数。引数の文字列はクォートを取り除いて出力。
    - 文字列リテラルは `"..."` か `'...'` で囲む。クォートが抜けると `NameError`。
    - 末尾の改行はデフォルトで自動付加 (`end="\n"`)。

    **読み方**: `print()` の括弧の中だけを見て、それがそのまま画面に出ます。

    ---

    下のコードを実行すると、画面に何が表示されるでしょうか？
  code: |
    print("Hello, World!")
  code_file_label: q01.py
  choices:
  - Hello, World!
  - '"Hello, World!"'
  - Hello,\nWorld!
  - NameError が出る
  correct_index: 0
  explanation: |-
    `print()` は引数として渡した文字列を、クォートを取り除いてそのまま 1 行で出力します。

    **ありがちな誤り**: クォート抜け・インデント崩れ・型混同 (`int` と `str` を `+` する等)。コードを 1 行ずつ追って読みましょう。
    **詳しくは**: 章 01 を再確認してください。
- kind: reading
  title: 変数の型は何？（章 02 復習）
  prompt: |
    **この問題の文法ポイント**

    - 小数点を含むリテラル (`3.14`) は `float` 型 / 整数 (`3`) は `int` 型 / クォート囲み (`"3"`) は `str` 型 / `True/False` は `bool` 型。
    - `type(x)` は **オブジェクトの型** を `<class '...'>` の形で返す。

    **読み方**: 代入されている値の **表記** を見て型を判定 — 小数点があるなら float、と覚える。

    ---

    下のコードを実行したとき、`type(x)` の結果として正しいものを選んでください。
  code: |
    x = 3.14
    print(type(x))
  code_file_label: q02.py
  choices:
  - <class 'int'>
  - <class 'float'>
  - <class 'str'>
  - <class 'decimal.Decimal'>
  correct_index: 1
  explanation: |-
    `3.14` のように小数点を含むリテラルは Python では `float` 型になります。整数なら `int`、`"3.14"` のようにクォートで囲めば `str` です。

    **ありがちな誤り**: クォート抜け・インデント崩れ・型混同 (`int` と `str` を `+` する等)。コードを 1 行ずつ追って読みましょう。
    **詳しくは**: 章 02 を再確認してください。
- kind: reading
  title: 整数除算と剰余（章 03 復習）
  prompt: |
    **この問題の文法ポイント**

    - `//` は **整数除算** (商の整数部)。`17 // 5 = 3`。
    - `%` は **剰余** (割った余り)。`17 % 5 = 2`。
    - 普通の割り算 `/` は `float` を返す (`17 / 5 = 3.4`)。

    **読み方**: 演算子の **記号 1 個か 2 個か** で動作が変わるので、`/` と `//` を取り違えない。

    ---

    下のコードの出力として正しいものを選んでください。
  code: |
    a = 17
    b = 5
    print(a // b, a % b)
  code_file_label: q03.py
  choices:
  - 3 2
  - 3.4 2
  - 2 3
  - 3 0
  correct_index: 0
  explanation: |-
    `//` は整数除算（小数点以下切り捨て）で 17 // 5 = 3、`%` は剰余で 17 % 5 = 2。`print(x, y)` はスペース区切りで並べて表示します。

    **ありがちな誤り**: クォート抜け・インデント崩れ・型混同 (`int` と `str` を `+` する等)。コードを 1 行ずつ追って読みましょう。
    **詳しくは**: 章 03 を再確認してください。
- kind: reading
  title: コメントの扱い（章 04 復習）
  prompt: |
    **この問題の文法ポイント**

    - 行頭の `#` 以降はその行末まで **コメント** として無視される。
    - 行の途中にある `#` も、それ以降は **同じ行のコメント** になる (インラインコメント)。
    - コメント部分は Python が実行しないので、`print("...")` がコメントの中にあっても出力されない。

    **読み方**: 各行で `#` の位置を見て、その左側だけが実行される、と読む。

    ---

    下のコードの出力として正しいものを選んでください。
  code: |
    # print("A")
    print("B")  # print("C")
    print("D")
  code_file_label: q04.py
  choices:
  - |-
    A
    B
    C
    D
  - |-
    B
    D
  - |-
    B
    C
    D
  - |-
    A
    B
    D
  correct_index: 1
  explanation: |-
    `#` から行末まではコメントとして無視されます。1 行目の `print("A")` も、2 行目末尾の `print("C")` も実行されません。

    **ありがちな誤り**: クォート抜け・インデント崩れ・型混同 (`int` と `str` を `+` する等)。コードを 1 行ずつ追って読みましょう。
    **詳しくは**: 章 04 を再確認してください。
- kind: reading
  title: len と sum の組み合わせ（章 05 復習）
  prompt: |
    **この問題の文法ポイント**

    - `sum(iter)` は要素の合計、`len(iter)` は要素数を返す **組み込み関数**。
    - `sum(nums) / len(nums)` で **平均** を計算するのが定型。
    - 整数同士の `/` でも結果は float (`100 / 4 == 25.0`)。

    **読み方**: まず `sum` の値、次に `len` の値を頭で計算してから割る。

    ---

    下のコードの出力として正しいものを選んでください。
  code: |
    nums = [10, 20, 30, 40]
    print(sum(nums) / len(nums))
  code_file_label: q05.py
  choices:
  - '100'
  - '25.0'
  - '4'
  - '10'
  correct_index: 1
  explanation: |-
    `sum([10,20,30,40]) = 100`、`len(...) = 4` で、Python 3 の `/` は浮動小数除算なので `100 / 4 = 25.0`。これは平均値を計算する典型パターンです。

    **ありがちな誤り**: クォート抜け・インデント崩れ・型混同 (`int` と `str` を `+` する等)。コードを 1 行ずつ追って読みましょう。
    **詳しくは**: 章 05 を再確認してください。
- kind: reading
  title: elif の分岐（章 06 復習）
  prompt: |
    **この問題の文法ポイント**

    - `if cond: ... elif cond2: ... else: ...` は **上から順に条件を試して、最初に真になったブロックだけ** を実行する。
    - 一度どれかが実行されると、残りの `elif/else` は **スキップ**される。
    - 各ブロックの中はインデント (4 スペース) で表す。

    **読み方**: 上から条件を順に評価し、最初に True になった行の `print` だけが動く、と追う。

    ---

    下のコードを実行したとき、画面に表示される文字列を選んでください。
  code: |
    score = 72
    if score >= 80:
        print("A")
    elif score >= 60:
        print("B")
    elif score >= 40:
        print("C")
    else:
        print("D")
  code_file_label: q06.py
  choices:
  - A
  - B
  - C
  - |-
    B
    C
  correct_index: 1
  explanation: |-
    `if / elif` は **最初に True になった枝だけ** 実行されます。`score = 72` は `>= 80` を満たさず、次の `>= 60` で True になるので `B` のみ表示されます。

    **ありがちな誤り**: クォート抜け・インデント崩れ・型混同 (`int` と `str` を `+` する等)。コードを 1 行ずつ追って読みましょう。
    **詳しくは**: 章 06 を再確認してください。
- kind: reading
  title: range の挙動（章 07 復習）
  prompt: |
    **この問題の文法ポイント**

    - `range(start, stop, step)` は `start` から `stop` の **手前** までを `step` ずつ進む整数列。
    - `stop` は **含まない** (半開区間)。`range(2, 8, 2)` は 2, 4, 6 の 3 個。
    - `for x in range(...)` でループ回数を制御するのが定型。

    **読み方**: 「start から始めて step ずつ足し、stop の前で止まる」と数え上げる。

    ---

    下のコードを実行すると、画面に何回 `*` が表示されるでしょうか？
  code: |
    for i in range(2, 8, 2):
        print("*")
  code_file_label: q07.py
  choices:
  - 2 回
  - 3 回
  - 4 回
  - 6 回
  correct_index: 1
  explanation: |-
    `range(2, 8, 2)` は `2, 4, 6` の 3 要素を返します（8 は含まれない、ステップ 2）。ループは 3 回回るので `*` は 3 回出力されます。

    **ありがちな誤り**: クォート抜け・インデント崩れ・型混同 (`int` と `str` を `+` する等)。コードを 1 行ずつ追って読みましょう。
    **詳しくは**: 章 07 を再確認してください。
- kind: reading
  title: リストのスライス（章 08 復習）
  prompt: |
    **この問題の文法ポイント**

    - リストの **スライス** `xs[i:j]` は index `i` から `j` の **手前** までの新しいリストを返す。
    - 元のリストは変わらない (非破壊)。`i` 省略で先頭から、`j` 省略で末尾まで。
    - 負のインデックスは末尾から (`xs[-1]` で最後の要素)。

    **読み方**: 「`i` 番から、`j` 番の **手前** まで」と区切って数える。

    ---

    下のコードの出力として正しいものを選んでください。
  code: |
    prices = [100, 200, 300, 400, 500]
    print(prices[1:4])
  code_file_label: q08.py
  choices:
  - '[200, 300, 400]'
  - '[100, 200, 300, 400]'
  - '[200, 300, 400, 500]'
  - '[100, 200, 300]'
  correct_index: 0
  explanation: |-
    スライス `[start:stop]` は **start を含み stop を含まない** 半開区間。`prices[1:4]` は index 1, 2, 3 の 3 要素、つまり `[200, 300, 400]` です。

    **ありがちな誤り**: クォート抜け・インデント崩れ・型混同 (`int` と `str` を `+` する等)。コードを 1 行ずつ追って読みましょう。
    **詳しくは**: 章 08 を再確認してください。
- kind: reading
  title: 辞書のキーアクセス（章 09 復習）
  prompt: |
    **この問題の文法ポイント**

    - 辞書 `d[key]` でキーから値を取り出す。**存在しないキー** だと `KeyError`。
    - `d.get(key, default)` は **キーが無くてもエラーにならず** デフォルト値を返す安全版。
    - 辞書のキー一覧は `d.keys()`、値は `d.values()`、ペアは `d.items()`。

    **読み方**: `.get(key, default)` の第 2 引数を見て、キーが無いときの返り値を判定。

    ---

    下のコードを実行したとき、何が起きるか正しいものを選んでください。
  code: |
    fund = {"name": "ABC Equity", "AUM": 1200}
    print(fund.get("expense_ratio", 0.0))
  code_file_label: q09.py
  choices:
  - KeyError で例外が出る
  - None が表示される
  - 0.0 が表示される
  - ABC Equity が表示される
  correct_index: 2
  explanation: |-
    `dict.get(key, default)` はキーが存在しないときに `default` を返すので、`expense_ratio` が無くても `0.0` が返ります。`fund["expense_ratio"]` で角括弧アクセスすると `KeyError` になります。

    **ありがちな誤り**: クォート抜け・インデント崩れ・型混同 (`int` と `str` を `+` する等)。コードを 1 行ずつ追って読みましょう。
    **詳しくは**: 章 09 を再確認してください。
- kind: reading
  title: 関数の戻り値（章 10 復習）
  prompt: |
    **この問題の文法ポイント**

    - `def f(x, y=デフォルト): return ...` で関数を定義。
    - `return` は関数の **戻り値** を呼び出し元に返して関数を抜ける。
    - デフォルト引数 (`rate=0.1`) は呼び出し時に省略可能。

    **読み方**: `return` の右辺を頭で計算し、呼び出し側の引数値を代入してみる。

    ---

    下のコードの出力として正しいものを選んでください。
  code: |
    def discount(price, rate=0.1):
        return price * (1 - rate)

    print(discount(1000))
  code_file_label: q10.py
  choices:
  - '900.0'
  - '1000'
  - '100.0'
  - TypeError が出る
  correct_index: 0
  explanation: |-
    `rate` はデフォルト引数 0.1。`discount(1000)` は `1000 * (1 - 0.1) = 900.0`。`*` の片方が float なので結果も float になります。

    **ありがちな誤り**: クォート抜け・インデント崩れ・型混同 (`int` と `str` を `+` する等)。コードを 1 行ずつ追って読みましょう。
    **詳しくは**: 章 10 を再確認してください。
