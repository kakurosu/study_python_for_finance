id: 32
title: コードを読もう — Phase F アプリ開発の総復習
phase: F
prerequisites:
- 30
- 31
learning_goals:
- Streamlit と PyAutoGUI / Playwright のコードを読み解ける
pages:
- kind: reading
  title: Streamlit でテキスト表示（章 30 復習）
  prompt: |
    **この問題の文法ポイント**

    - Streamlit は **Python スクリプトをそのまま Web アプリ化** するフレームワーク。
    - `st.title(...)` で見出し、`st.write(...)` で任意のオブジェクト (文字列・DataFrame・図) を描画。
    - 起動は `streamlit run script.py`。ファイル保存で自動リロード。

    **読み方**: `st.xxx(...)` 1 行 = ブラウザ上の 1 要素、と対応付け。

    ---

    下のコードが画面に表示するものとして正しいものを選んでください。
  code: |
    import streamlit as st
    st.title("ポートフォリオ分析")
    st.write("Sharpe Ratio:", 0.85)
  code_file_label: q01.py
  choices:
  - コンソールに 2 行だけ出力する
  - Web ブラウザ上にタイトルと値（0.85）を表示する
  - ファイルを書き出す
  - エラーが出る（streamlit はライブラリではない）
  correct_index: 1
  explanation: |-
    Streamlit は **Python スクリプトを Web アプリ化** するライブラリ。`streamlit run app.py` でブラウザ上に UI が描画され、`st.title`／`st.write` がそれぞれタイトルと本文として表示されます。

    **ありがちな誤り**: Streamlit の再実行モデルを意識せず重い処理を毎回走らせる、自動化で `FAILSAFE` を切ってしまう、Playwright で `headless=True` を忘れる等。
    **詳しくは**: 章 30 を再確認してください。
- kind: reading
  title: Streamlit のスライダー（章 30 復習）
  prompt: |
    **この問題の文法ポイント**

    - `st.slider(label, min, max, default)` は **ユーザーが現在選んでいる値そのもの** を返す。
    - 範囲を float で渡すと戻り値も float、int で渡すと int。
    - スライダーが動くたびにスクリプト全体が再実行される (Streamlit の再実行モデル)。

    **読み方**: 戻り値は **その時点で選択中の値**、と直感的に。

    ---

    下のコードについて、`risk_free` の型として正しいものを選んでください。
  code: |
    import streamlit as st
    risk_free = st.slider("Risk-free rate (%)", 0.0, 5.0, 1.0, step=0.1)
  code_file_label: q02.py
  choices:
  - int
  - float（ユーザーが選択した値）
  - Streamlit 内部オブジェクト（数値ではない）
  - list[float]
  correct_index: 1
  explanation: |-
    `st.slider` は **ユーザーが現在選択している値そのもの** を返します。範囲を float で指定したので戻り値も float。`0.0 〜 5.0` の範囲、初期値 1.0、刻み 0.1 のスライダーです。

    **ありがちな誤り**: Streamlit の再実行モデルを意識せず重い処理を毎回走らせる、自動化で `FAILSAFE` を切ってしまう、Playwright で `headless=True` を忘れる等。
    **詳しくは**: 章 30 を再確認してください。
- kind: reading
  title: マウス操作の自動化（章 31 復習）
  prompt: |
    **この問題の文法ポイント**

    - `pyautogui.moveTo(x, y, duration=t)` は **マウスカーソルを (x, y) へ t 秒かけて移動** する関数。
    - 座標は画面の左上が (0, 0)。`duration=0` で瞬間移動。
    - 暴走対策: `pyautogui.FAILSAFE = True` (画面左上にカーソルを動かすと例外で停止)。

    **読み方**: 関数名 `moveTo` を見たら **絶対座標への移動**、と判定。

    ---

    下のコードが行うこととして正しいものを選んでください。
  code: |
    import pyautogui
    pyautogui.moveTo(500, 300, duration=0.5)
    pyautogui.click()
  code_file_label: q03.py
  choices:
  - (500, 300) ピクセルの色を取得する
  - 画面上の座標 (500, 300) にマウスを 0.5 秒かけて動かし、クリックする
  - 500×300 の画像を保存する
  - (500, 300) の位置にウィンドウを移動する
  correct_index: 1
  explanation: |-
    `moveTo(x, y, duration)` はマウスカーソルを指定座標へ動かす（`duration` で滑らかに）、`click()` は現在位置でクリック。GUI 操作の自動化に使います。

    **ありがちな誤り**: Streamlit の再実行モデルを意識せず重い処理を毎回走らせる、自動化で `FAILSAFE` を切ってしまう、Playwright で `headless=True` を忘れる等。
    **詳しくは**: 章 31 を再確認してください。
- kind: reading
  title: Playwright でページ取得（章 31 復習）
  prompt: |
    **この問題の文法ポイント**

    - Playwright は **ブラウザを Python から操作** するライブラリ。`with sync_playwright()` でリソース管理。
    - `p.chromium.launch(channel="chrome", headless=True)` でシステム Chrome を **画面非表示** で起動 (バッチ用)。
    - `channel` を省くと Playwright バンドルの Chromium を使う (別途 `playwright install chromium` が必要)。
    - `page.goto(url)` でアクセス、`page.content()` で HTML 取得、`page.close()` / `browser.close()` で終了。

    **読み方**: with ブロック内で browser → page → 操作 → close、の流れを追う。

    ---

    下のコードが取得しているものとして正しいものを選んでください。
  code: |
    from playwright.sync_api import sync_playwright
    with sync_playwright() as p:
        browser = p.chromium.launch(channel="chrome")
        page = browser.new_page()
        page.goto("https://example.com")
        content = page.content()
        browser.close()
  code_file_label: q04.py
  choices:
  - Chromium で example.com を開き、レンダリング後の HTML を取得する
  - サーバーから生 HTML を直接取得する（JS は実行されない）
  - example.com のスクリーンショットを撮る
  - example.com の DNS レコード
  correct_index: 0
  explanation: |-
    Playwright は **ヘッドレスブラウザ** を起動し、JavaScript を実行した **後の** DOM を取得できます。`page.content()` はレンダリング済み HTML を返すので、SPA など requests では取れないサイトに有効です。

    **ありがちな誤り**: Streamlit の再実行モデルを意識せず重い処理を毎回走らせる、自動化で `FAILSAFE` を切ってしまう、Playwright で `headless=True` を忘れる等。
    **詳しくは**: 章 31 を再確認してください。
