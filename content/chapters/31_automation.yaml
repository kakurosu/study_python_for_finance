id: 31
title: "自動操作 (PyAutoGUI / Playwright)"
phase: F
prerequisites: [10]
learning_goals:
  - "PyAutoGUI でキー入力・スクリーンショットの API 形を理解する"
  - "Playwright で page.goto / page.click / page.fill を組み立てる"
  - "FAILSAFE / ヘッドレスモードで安全に実行する習慣を身につける"

pages:
  - kind: sample
    title: "自動操作のリスクと安全装置"
    markdown: |
      ## 自動化は両刃の剣
      自動操作は **強力だが暴走するとシステムを壊す** こともあります。
      必ず以下を守りましょう。

      - PyAutoGUI: `pyautogui.FAILSAFE = True` を **必ず有効** に。
        マウスを画面端に動かすだけで強制中断できます。
      - Playwright: 開発時は **ヘッドレスモード** で動作確認を。
      - 対象は自分が管理するアプリ・サンプルサイトのみ。
        他人の運営するサイトに不正アクセスしない。

      この章では実際にマウスを動かさず、API の **コード形** だけ確認します。
    sample_code: |
      # FAILSAFE がデフォルトで True であることだけを確認（実行はしない）
      import pyautogui
      print("FAILSAFE:", pyautogui.FAILSAFE)
    runnable: true
    stickman: explain
    stickman_speech: "暴走対策は、自動化の必須リテラシー。"

  - kind: sample
    title: "Playwright の基本コード形"
    markdown: |
      ## Playwright Sync API
      ```python
      from playwright.sync_api import sync_playwright
      with sync_playwright() as p:
          browser = p.chromium.launch(headless=True)
          page = browser.new_page()
          page.goto("https://example.com")
          page.fill("#username", "alice")
          page.click("button[type=submit]")
          browser.close()
      ```
      この章ではコードの **組み立て** に焦点を当てます。
    sample_code: |
      template = """
      from playwright.sync_api import sync_playwright
      with sync_playwright() as p:
          browser = p.chromium.launch(headless=True)
          page = browser.new_page()
          page.goto(URL)
          browser.close()
      """
      print(len(template.splitlines()), "行のテンプレート")
    runnable: true
    stickman: explain
    stickman_speech: "page.goto / page.click / page.fill — まずはこの 3 つ。"

  - kind: exercise
    title: "PyAutoGUI の FAILSAFE を有効化"
    prompt: |
      `pyautogui.FAILSAFE = ...` で安全装置を有効にしてください。
    code_template: |
      import pyautogui
      pyautogui.FAILSAFE = {{slot:flag}}
      print(pyautogui.FAILSAFE)
    blanks:
      - id: flag
        canonical_answer: "True"
        accept_patterns: ['^True$']
        hint: "Bool で True"
    test_cases:
      - kind: stdout_regex
        pattern: '^True\s*$'
    hints:
      - "`True`"
      - "`True`"
    stickman_feedback:
      correct: "暴走対策、これでひと安心。"
      wrong_hint1: "`True`"
      wrong_hint2: "`True`"
      wrong_hint3: "`True`"

  - kind: exercise
    title: "Playwright の launch オプション"
    prompt: |
      開発中は **ヘッドレスモード** でブラウザを起動します。`headless=True` を指定するコードを完成させてください。
    code_template: |
      def build_launch_call(headless_flag):
          return f"p.chromium.launch(headless={{slot:val}})"

      print(build_launch_call(True))
    blanks:
      - id: val
        canonical_answer: "headless_flag"
        accept_patterns:
          - '^headless_flag$'
          - '^True$'
        hint: "引数の値そのまま"
    test_cases:
      - kind: stdout_regex
        pattern: 'launch\(headless='
    hints:
      - "引数 headless_flag をそのまま入れる。"
      - "`headless_flag`"
    stickman_feedback:
      correct: "ヘッドレスは CI / 自動テストで必須。"
      wrong_hint1: "`headless_flag`"
      wrong_hint2: "`headless_flag`"
      wrong_hint3: "`headless_flag`"

  - kind: exercise
    title: "Playwright で URL を開くコード"
    prompt: |
      関数 `goto_url` の中で **page オブジェクトのメソッド** を呼んで URL に遷移させてください。
    code_template: |
      def goto_url(page, url):
          page.{{slot:fn}}(url)

      class FakePage:
          def goto(self, u):
              print("visiting:", u)

      goto_url(FakePage(), "https://example.com")
    blanks:
      - id: fn
        canonical_answer: "goto"
        accept_patterns: ['^goto$']
        hint: "URL に遷移するメソッド"
    test_cases:
      - kind: stdout_regex
        pattern: 'visiting: https://example\.com'
    hints:
      - "`goto`"
      - "`goto`"
    stickman_feedback:
      correct: "Playwright は宣言的で読みやすい。"
      wrong_hint1: "`goto`"
      wrong_hint2: "`goto`"
      wrong_hint3: "`goto`"

  # ─── 参考実装: Playwright headless でページスクショ ────
  - kind: sample
    title: "参考実装 — Playwright headless でスクリーンショット保存"
    markdown: |
      ## 「ブラウザを開かずに」スクショを撮る

      `headless=True` は **画面に表示せず裏で動かす** モード。CI / バッチ実行で必須。

      **業界での使い道**:
      - 毎朝、レポート Web をスクショして PDF 添付メール送信
      - サイトのデザイン変更を毎日検出 (visual regression)
      - **ユーザー名・パスワード** を入力してログイン後画面を撮る (要 secret 管理)

      **安全装置** (人間の作業を上書きしないため):
      - `pyautogui.FAILSAFE = True` (画面左上にカーソルを動かすと例外で停止)
      - `pyautogui.PAUSE = 0.5` (各操作の間に 0.5 秒待つ)
      - Playwright は **完全に別ブラウザ** なので人間の作業に干渉しない (より安全)
    sample_code: |
      # この Sample は本来 Playwright ブラウザを起動するため、本セッションでは
      # 「擬似的に手順を示す」形に留めます。実 Playwright 実行例は次の通り:
      print("=== Playwright headless screenshot の擬似手順 ===\n")
      print("from playwright.sync_api import sync_playwright")
      print()
      print("with sync_playwright() as p:")
      print("    browser = p.chromium.launch(headless=True)   # 画面非表示")
      print("    page    = browser.new_page()")
      print("    page.goto('https://example.com')")
      print("    page.wait_for_load_state('networkidle')      # 完全読込まで待機")
      print("    page.screenshot(path='example.png', full_page=True)")
      print("    browser.close()")
      print()
      print("--- 業界での運用例 ---")
      print("- 毎朝 6:00 cron で実行 → 主要 30 サイトをスクショ")
      print("- 前日との pixel diff > 5% でアラート (visual regression)")
      print("- スクショは S3 / Azure Blob に日付付きで保管 → 監査証跡")
      print()
      print("--- 安全装置 ---")
      print("- headless=True で人間の画面を奪わない")
      print("- timeout 30 秒で固まったら強制終了")
      print("- 失敗 3 回でアラート、自動リカバリ後に再試行")
    runnable: true
    stickman: explain
    stickman_speech: "Playwright headless は「夜中に黙々と働くロボット」のための仕組み。"
