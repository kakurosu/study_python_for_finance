  # ─── 演習 3: ARIMA 推定 ───────────────────────────
  - kind: exercise
    title: "ARIMA でモデル推定しよう"
    prompt: |
      AR(1) の系列 `y` から `ARIMA(1, 0, 0)` を推定してください。
      `order=(p, d, q)` の意味:
      - **p = 1**: AR の次数（過去 1 期）
      - **d = 0**: 差分なし（系列が既に定常と仮定）
      - **q = 0**: MA なし

      この組合せが **AR(1)** を表します。
    code_template: |
      import numpy as np
      from statsmodels.tsa.arima.model import ARIMA
      np.random.seed(0)
      y = np.random.normal(0, 1, 200)
      for i in range(1, len(y)):
          y[i] = 0.7 * y[i-1] + np.random.normal()
      model = ARIMA(y, order=({{slot:p}}, {{slot:d}}, {{slot:q}}))
      result = model.fit()
      print("AR(1) 係数:", round(float(result.params[0]), 2))
    blanks:
      - id: p
        canonical_answer: "1"
        accept_patterns: ['^1$']
      - id: d
        canonical_answer: "0"
        accept_patterns: ['^0$']
      - id: q
        canonical_answer: "0"
        accept_patterns: ['^0$']
    test_cases:
      - kind: stdout_regex
        pattern: 'AR\(1\) 係数:'
    hints:
      - "AR(1) は (p,d,q) = (1, 0, 0)。"
      - "`1`, `0`, `0`。"
    stickman_feedback:
      correct: "ARIMA の order を決めれば、ほぼ呼ぶだけ。"
      wrong_hint1: "(1, 0, 0) を指定。"
