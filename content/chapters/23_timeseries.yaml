id: 23
title: "時系列分析"
phase: D
prerequisites: [15, 17]
learning_goals:
  - "定常性・自己相関・ホワイトノイズ・ランダムウォークの違いを説明できる"
  - "AR(1) の長期平均・分散・半減期を理解し、φ の値が挙動に与える影響を説明できる"
  - "ACF / PACF を使って ARMA(p, q) の次数候補を絞り込める"
  - "ADF 検定で単位根を判定し、差分階数 d を決められる"
  - "Box-Jenkins 方法論の 4 ステップで実データに ARIMA を当てられる"
  - "statsmodels の summary 出力（係数・p 値・信頼区間）を読み解け、点予測と予測区間を区別して解釈できる"

pages:
  # ─── 0. 時系列の基礎用語 ─────────────────────────────
  - kind: sample
    title: "時系列分析の基本用語"
    markdown: |
      ## 時系列とは

      **時系列 (time series)** とは、時間順に並んだ観測値の系列 $\{y_t\}_{t=1,2,\dots,T}$ のこと。
      株価・金利・GDP・気温・売上高など、金融・経済データの大半はこの形をしています。

      ### 1. 定常性 (stationarity)

      **(弱)定常性** とは、次の 3 条件を満たすこと:

      - **平均が一定**: $\mathbb{E}[y_t] = \mu$ (時間 $t$ によらない)
      - **分散が一定**: $\mathrm{Var}(y_t) = \sigma^2$
      - **共分散が時差だけに依存**: $\mathrm{Cov}(y_t, y_{t-k}) = \gamma(k)$ ($t$ には依存せず、$k$ だけに依存)

      ここで:
      - $y_t$ : 時刻 $t$ における観測値（確率変数）
      - $\mathbb{E}[\cdot]$ : 期待値（母集団平均）
      - $\mathrm{Var}(\cdot)$ : 分散、$\mathrm{Cov}(\cdot, \cdot)$ : 共分散
      - $\mu$ : 一定の平均（時間に依存しない定数）
      - $\sigma^2$ : 一定の分散
      - $\gamma(k)$ : ラグ $k$ の自己共分散関数
      - $k$ : ラグ（時差）の大きさ

      **多くの統計モデル（ARMA など）は定常性を前提**にしているため、まず定常か非定常かを判断するのが時系列分析の出発点です。

      ### 2. ホワイトノイズ (white noise)

      $$ \varepsilon_t \overset{\text{i.i.d.}}{\sim} \mathcal{N}(0, \sigma^2) $$

      ここで:
      - $\varepsilon_t$ : 時刻 $t$ のショック（誤差項、innovation）
      - $\overset{\text{i.i.d.}}{\sim}$ : 互いに独立（independent）かつ同一分布（identically distributed）
      - $\mathcal{N}(0, \sigma^2)$ : 平均 0、分散 $\sigma^2$ の正規分布

      平均 0・分散 $\sigma^2$ で、過去とまったく相関がない系列。**「説明できる構造が何もない」状態のベンチマーク**。
      モデルが当てはまったかを確認するときは「**残差がホワイトノイズになっているか**」を見ます (＝ **残差の白色化**)。

      ### 3. ランダムウォーク (random walk)

      $$ y_t = y_{t-1} + \varepsilon_t $$

      ここで:
      - $y_t$ : 時刻 $t$ における系列の値
      - $y_{t-1}$ : 1 期前 (時刻 $t-1$) の値
      - $\varepsilon_t$ : ホワイトノイズ（前項で定義）

      毎時点 $\varepsilon_t$ ずつ累積していく系列。**非定常** (分散が時間 $t$ に比例して大きくなる)。
      株価などはランダムウォークに近い動きを示し、差分 ($\Delta y_t = y_t - y_{t-1}$) を取ると定常 (= リターン) になる、というのが金融時系列の基本構造です。

      ### 4. 自己相関 (autocorrelation)

      時系列 $y_t$ と $y_{t-k}$ のあいだの相関係数を **自己相関**、$k$ を **ラグ (lag)** と呼びます:

      $$ \rho(k) = \dfrac{\mathrm{Cov}(y_t, y_{t-k})}{\mathrm{Var}(y_t)} $$

      ここで:
      - $\rho(k)$ : ラグ $k$ の自己相関係数（$-1 \le \rho(k) \le 1$）
      - $\mathrm{Cov}(y_t, y_{t-k})$ : 現在値と $k$ 期前の値の共分散（= $\gamma(k)$）
      - $\mathrm{Var}(y_t)$ : 系列の分散（定常なら $\gamma(0)$ に等しい）
      - $k$ : ラグ（$k = 0, 1, 2, \dots$）。$\rho(0) = 1$ で必ず始まる

      ラグごとに並べた関数 $\rho(0), \rho(1), \rho(2), \dots$ を **自己相関関数 ACF** といいます。
    sample_code: |
      import numpy as np
      np.random.seed(0)

      # 1) ホワイトノイズ
      wn = np.random.normal(0, 1, 200)

      # 2) ランダムウォーク (ホワイトノイズの累積和)
      rw = wn.cumsum()

      # 3) AR(1) 過程: y_t = 0.7 * y_{t-1} + ε_t (定常)
      ar1 = np.zeros(200)
      for t in range(1, 200):
          ar1[t] = 0.7 * ar1[t-1] + np.random.normal()

      for name, x in [("White Noise", wn), ("Random Walk", rw), ("AR(1) φ=0.7", ar1)]:
          print(f"{name:14s}  mean={x.mean():+.3f}  std={x.std():.3f}")
      # ホワイトノイズと AR(1) は標準偏差が安定 (定常)
      # ランダムウォークだけ標準偏差が大きく出る (非定常)
    runnable: true
    stickman: explain
    stickman_speech: "ホワイトノイズ・ランダムウォーク・AR(1) — まずこの 3 つの違いを身体で覚えよう。"

  # ─── 1a. AR(1) モデル: 数学的性質 ─────────────────────
  - kind: sample
    title: "AR(1): 自己回帰モデルの数学的性質"
    markdown: |
      ## AR(1) モデル — 最も基本的な時系列モデル

      過去 1 期の自分自身で現在を説明するモデル:

      $$ y_t = c + \phi\, y_{t-1} + \varepsilon_t,\quad \varepsilon_t \sim \mathcal{N}(0,\sigma^2) $$

      ここで:
      - $y_t$ : 時刻 $t$ における系列の値（被説明変数）
      - $y_{t-1}$ : 1 期前 (時刻 $t-1$) の値（説明変数）
      - $c$ : **定数項 (切片, intercept)** — 系列の水準を決める定数で、長期平均そのものではない点に注意
      - $\phi$ (ファイ) : **自己回帰係数** — 過去の値をどれだけ引きずるかを決める ($-1 < \phi < 1$ で定常)
      - $\varepsilon_t$ : ホワイトノイズ (平均 0、分散 $\sigma^2$ の独立誤差項)
      - $\sigma^2$ : 誤差項（イノベーション）の分散

      > **記号の流儀差**: 本書では切片を $c$、長期平均を $\mu$ と分けて書きますが、
      > 別の教科書（例: 田中孝文『現場ですぐ使える時系列データ分析』）では **切片自体に $\mu$** を割り当て、
      > 長期平均は $\mu / (1 - \phi)$ と書きます。数式は完全に等価ですが、同じ $\mu$ が文献によって
      > 別の量を指すので混同しないよう注意してください。

      ### φ の値ごとの挙動

      | φ の値 | 系列の振る舞い | 例 |
      |---|---|---|
      | $\phi = 0$ | 過去と無相関 → ホワイトノイズと同じ | 公平なコイン投げ系列 |
      | $0 < \phi < 1$ | **平均回帰** (mean reversion) する定常系列 | 金利スプレッド、ペアトレードの bp 差 |
      | $\phi = 1$ | **ランダムウォーク** (単位根) — 非定常 | 株価の対数 (log price) |
      | $\phi > 1$ | 発散 (爆発的に大きくなる) — 現実にはほぼ無い | — |
      | $-1 < \phi < 0$ | 振動しながら平均回帰 | 在庫の在庫過剰⇄不足の振り子 |

      ### 定常 AR(1) の 3 つの公式 ($|\phi| < 1$ のとき)

      | 量 | 公式 | 意味 |
      |---|---|---|
      | 長期平均 (long-run mean) | $\mu = \dfrac{c}{1 - \phi}$ | 系列が長期的に戻っていく値 |
      | 分散 (unconditional variance) | $\mathrm{Var}(y_t) = \dfrac{\sigma^2}{1 - \phi^2}$ | $\phi \to 1$ で爆発 → ランダムウォークの非定常性の数学的根拠 |
      | 自己相関関数 (ACF) | $\rho(k) = \phi^{k}$ | ラグ $k$ ごとに指数的に減衰、$\phi$ が大きいほどゆっくり |

      **長期平均の直感的導出**: 定常なら $\mathbb{E}[y_t] = \mathbb{E}[y_{t-1}] = \mu$。
      モデル式の両辺に期待値を取ると $\mu = c + \phi \mu + 0$ となり、$\mu(1-\phi) = c$ より
      $\mu = c/(1-\phi)$。$|\phi| < 1$ で分母が 0 にならないので有限値が定まります。

      ### 平均回帰の半減期

      AR(1) が長期平均から「半分の距離」まで戻る期間は:

      $$ \text{half-life} = \dfrac{\ln(0.5)}{\ln(|\phi|)} $$

      ここで:
      - $\text{half-life}$ : 半減期（単位は元の系列のサンプリング間隔。日次データなら「日」）
      - $\ln(\cdot)$ : 自然対数
      - $\phi$ : AR(1) 係数（$0 < |\phi| < 1$ のときに有限の正値）

      例: $\phi = 0.9$ なら半減期は約 6.6 期。$\phi = 0.5$ なら 1 期。
      **金融実務**ではペアトレードのエントリ判断にこの数値を使います。

      ### statsmodels の流儀

      AR 多項式は **`[1, -φ]`** の符号反転形式で渡します。
      これは AR モデルを「ラグ多項式」$(1 - \phi L)\,y_t = \varepsilon_t$ と書く慣習に由来します ($L$ はラグ演算子)。

      ### 一般化: AR(p)

      $$ y_t = c + \phi_1 y_{t-1} + \phi_2 y_{t-2} + \dots + \phi_p y_{t-p} + \varepsilon_t $$

      ここで:
      - $p$ : AR の次数（過去何期分を使うか）
      - $\phi_1, \phi_2, \dots, \phi_p$ : 各ラグの自己回帰係数（AR(1) の $\phi$ をラグごとに一般化したもの）
      - その他の記号は AR(1) と同じ

      過去 $p$ 期分の自分を線形結合して説明する。statsmodels の `ARIMA(order=(p, 0, 0))` で推定できます。
    sample_code: |
      import numpy as np
      from statsmodels.tsa.arima_process import arma_generate_sample
      np.random.seed(42)
      # statsmodels の AR 多項式は [1, -φ1, -φ2, ...] の符号反転形式
      ar_params = np.array([1, -0.7])    # φ = 0.7
      ma_params = np.array([1])          # MA なし
      y = arma_generate_sample(ar_params, ma_params, nsample=500)

      phi = 0.7
      sigma = 1.0          # 残差ε の標準偏差 (arma_generate_sample のデフォルト)
      print("【 AR(1) φ = 0.7 の理論値 vs 標本値 】")
      print(f"  長期平均 (理論)   : 0.0  (c=0 なので)")
      print(f"  長期平均 (標本)   : {y.mean():.3f}")
      print(f"  分散 (理論)       : {sigma**2 / (1 - phi**2):.3f}")
      print(f"  分散 (標本)       : {y.var(ddof=1):.3f}")
      # 半減期
      half_life = np.log(0.5) / np.log(phi)
      print(f"  半減期            : {half_life:.2f} 期")
      print(f"  ρ(1) 理論 = φ^1   : {phi**1:.3f}")
      print(f"  ρ(5) 理論 = φ^5   : {phi**5:.3f}")
    runnable: true
    stickman: explain
    stickman_speech: "φ から長期平均・分散・ACF・半減期がすべて出る — これが AR(1) の美しさ！"

  # ─── 1b. AR(1) を可視化: 3 つの φ で挙動を見る ───────
  - kind: sample
    title: "AR(1) を可視化: φ ごとに挙動はどう違う?"
    markdown: |
      ## 3 つの φ で同じ乱数を回し、挙動の違いを目で見る

      同じ $\varepsilon_t$ 系列を使って、$\phi = 0$ (ホワイトノイズ), $\phi = 0.5$ (穏やかな平均回帰),
      $\phi = 0.95$ (強い引きずり) の 3 つを並べると、なぜ $\phi$ が「過去の引きずり度合い」と
      呼ばれるかが直感的に分かります。

      ### 観察ポイント

      - **$\phi = 0$**: ジグザグでまったくトレンドなし。隣り合う点が完全に独立
      - **$\phi = 0.5$**: 軽い「うねり」が出るが、すぐ 0 に戻る
      - **$\phi = 0.95$**: 長い「うねり」が出て、平均 0 から大きく離れた状態がしばらく続く

      $\phi = 1$（ランダムウォーク）にすると、戻ってこなくなり「漂流」します。
      これが「**株価は単位根 ($\phi \approx 1$) を持つから差分を取らないと扱いにくい**」と言われる理由です。
    sample_code: |
      import numpy as np
      import matplotlib.pyplot as plt

      np.random.seed(123)
      n = 250
      eps = np.random.normal(0, 1, n)   # 共通のショック列

      def simulate_ar1(phi: float, eps: np.ndarray) -> np.ndarray:
          y = np.zeros_like(eps)
          for t in range(1, len(eps)):
              y[t] = phi * y[t-1] + eps[t]
          return y

      phis = [0.0, 0.5, 0.95]
      fig, axes = plt.subplots(3, 1, figsize=(8, 6), sharex=True)
      for ax, phi in zip(axes, phis):
          y = simulate_ar1(phi, eps)
          ax.plot(y, color="steelblue", linewidth=0.9)
          ax.axhline(0, color="gray", linewidth=0.7, alpha=0.5)
          ax.set_title(f"AR(1)  φ = {phi}")
          ax.set_ylim(-6, 6)
      axes[-1].set_xlabel("time")
      fig.tight_layout()
      plt.show()
      print("φ が大きいほど『一度離れた状態』が長く続く → 半減期が長い")
    runnable: true
    stickman: explain
    stickman_speech: "同じショック列でも φ が違うと景色が一変。これが時系列モデルの面白さだよ！"

  # ─── 2. MA / ARMA モデル ────────────────────────────
  - kind: sample
    title: "MA / ARMA モデル"
    markdown: |
      ## 移動平均モデル MA(q)

      AR が「過去の自分」で説明するのに対し、MA は **「過去の誤差項」** で説明します:

      $$ y_t = \mu + \varepsilon_t + \theta_1 \varepsilon_{t-1} + \dots + \theta_q \varepsilon_{t-q} $$

      ここで:
      - $y_t$ : 時刻 $t$ における系列の値
      - $\mu$ : 系列の平均（MA(q) の長期平均はそのまま $\mu$）
      - $q$ : MA の次数（過去何期のショックを引きずるか）
      - $\theta_1, \theta_2, \dots, \theta_q$ : MA 係数（ショックの減衰の仕方を決める、$\theta$ = テータ）
      - $\varepsilon_t, \varepsilon_{t-1}, \dots, \varepsilon_{t-q}$ : 現在および過去 $q$ 期分のホワイトノイズ

      MA(q) は常に定常 (有限和なので分散が爆発しない)。一時的なショックの **減衰** を表すのに向きます。

      ## ARMA(p, q)

      AR と MA を組み合わせると **ARMA(p, q)**:

      $$ y_t = c + \sum_{i=1}^{p}\phi_i\, y_{t-i} + \sum_{j=1}^{q}\theta_j\, \varepsilon_{t-j} + \varepsilon_t $$

      ここで:
      - $p$ : AR 部分の次数、$q$ : MA 部分の次数
      - $\phi_i$ : 第 $i$ ラグの AR 係数 ($i = 1, 2, \dots, p$)
      - $\theta_j$ : 第 $j$ ラグの MA 係数 ($j = 1, 2, \dots, q$)
      - その他の記号は AR / MA と同じ

      **「過去の自分」+「過去のショックの引きずり」** で柔軟に表現でき、実データの当てはめでは ARMA(1,1) や ARMA(2,1) がよく登場します。

      ## ACF と PACF — 次数の決め方

      モデルの $p$ と $q$ を決める標準的な道具:

      | 指標 | 意味 | 何で使う？ |
      |---|---|---|
      | **ACF**  (自己相関関数) | $\rho(k) = \mathrm{Corr}(y_t, y_{t-k})$ | **MA(q)** の次数特定（ラグ $q$ で打ち切れる） |
      | **PACF** (偏自己相関関数) | ラグ $1,\dots,k-1$ の効果を取り除いた $y_t$ と $y_{t-k}$ の相関 | **AR(p)** の次数特定（ラグ $p$ で打ち切れる） |

      経験則:
      - **AR(p)**:  ACF は緩やかに減衰、PACF はラグ $p$ で **ばっさり 0** に
      - **MA(q)**:  ACF はラグ $q$ で **ばっさり 0**、PACF は緩やかに減衰
      - **ARMA**:   両方とも緩やかに減衰
    sample_code: |
      import numpy as np
      from statsmodels.tsa.stattools import acf, pacf
      np.random.seed(0)

      # AR(1) φ=0.7 の系列を生成
      y = np.zeros(300)
      for t in range(1, 300):
          y[t] = 0.7 * y[t-1] + np.random.normal()

      ac = acf(y, nlags=8)
      pa = pacf(y, nlags=8)
      print("lag | ACF    | PACF")
      print("----+--------+------")
      for k, (a, p) in enumerate(zip(ac, pa)):
          print(f" {k:2d} | {a:+.3f} | {p:+.3f}")
      # AR(1) なので PACF はラグ 1 だけ大きく、ラグ 2 以降はほぼ 0 になる
    runnable: true
    stickman: explain
    stickman_speech: "ACF は MA、PACF は AR — この対応を覚えれば次数決めの 80% は片付くよ！"

  # ─── 3. 差分・ARIMA / 単位根検定 ─────────────────────
  - kind: sample
    title: "ARIMA(p, d, q) と差分"
    markdown: |
      ## 非定常 → 差分 → 定常

      **株価・売上高・物価指数** など実データの多くは非定常 (トレンドあり / 分散が成長する)。
      そのままでは ARMA を当てはめられないので、**差分 (differencing)** を取って定常化します:

      $$ \Delta y_t = y_t - y_{t-1} $$

      これでまだ非定常なら 2 階差を取ります ($\Delta^2 y_t = \Delta y_t - \Delta y_{t-1}$)。

      **ARIMA(p, d, q)** はこの差分を組み込んだモデルで、各次数の意味は:

      | 次数 | 何を表すか | 実務でよく使う値 |
      |---|---|---|
      | **p** | AR の次数 — 過去の値で説明 | 0 - 3 |
      | **d** | **差分の階数** — 単位根を消す | **1** が圧倒的、株価は d=1 で対数差分 (= 対数リターン) と同等 |
      | **q** | MA の次数 — 過去の誤差で説明 | 0 - 3 |

      ## ADF 検定 — 単位根の有無を統計的に判定

      Augmented Dickey-Fuller 検定の仮説:

      $$ H_0: \text{単位根あり (非定常)},\quad H_1: \text{定常} $$

      ここで:
      - $H_0$ : 帰無仮説 (null hypothesis) — 棄却したい主張
      - $H_1$ : 対立仮説 (alternative hypothesis) — 採用したい主張
      - 「単位根あり」 = AR(1) でいうと $\phi = 1$ → ランダムウォーク → 非定常

      **判断**:
      - p 値 < 0.05 → 帰無棄却 → **定常** → 差分不要 (`d=0`)
      - p 値 ≥ 0.05 → 棄却できない → **非定常** → 1 階差を取って再検定 (`d=1`)

      **金融データの典型**:
      - **株価そのもの** はほぼ常に非定常 (`d=1` が必要)
      - **株価リターン** (差分済) はほぼ常に定常 (`d=0` で OK)
      - **金利・CPI** などマクロは判断が分かれる → ADF 必須
    sample_code: |
      import warnings
      warnings.filterwarnings("ignore")
      import pandas as pd
      from statsmodels.tsa.stattools import adfuller

      df = pd.read_csv("data/macro_indicators.csv", parse_dates=["date"]).set_index("date")
      cpi = df["CPI_yoy"]

      def report(series, name: str) -> None:
          stat, p, *_ = adfuller(series.dropna())
          verdict = "定常 (棄却 ○)" if p < 0.05 else "非定常 (棄却 ×)"
          print(f"{name:20s}: ADF stat={stat:7.3f}  p={p:.4f}  {verdict}")

      report(cpi,         "CPI level")
      report(cpi.diff(),  "CPI 1st diff")
      # 比較: 株価 (大抵 d=1 が必要)
      px = pd.read_csv("data/stocks_daily.csv", parse_dates=["date"]).set_index("date")["AAPL_jp"]
      report(px,              "Stock price level")
      report(px.pct_change(), "Stock returns")
    runnable: true
    expected_output: "ADF stat"
    stickman: explain
    stickman_speech: "差分を取るかは「迷ったら ADF」。これを習慣化すると時系列の取り扱いが安定する。"

  # ─── 3b. Box-Jenkins 方法論 ──────────────────────────
  - kind: sample
    title: "Box-Jenkins 方法論 — ARIMA 選定の4ステップ"
    markdown: |
      ## ARIMA を実データに当てるときの標準フロー

      Box と Jenkins (1970) が提案し、いまも実務の標準となっている 4 ステップの流れ:

      ### Step 1. Identification (識別)

      モデルの次数 $(p, d, q)$ の **候補**を絞る:

      1. 系列を **プロット** してトレンド・季節性・分散の変化を眺める
      2. **対数変換** が必要か検討（分散が時間と共に大きくなる場合）
      3. **ADF 検定** で単位根を確認 → 必要な差分階数 $d$ を決定
      4. 差分済み系列の **ACF / PACF** を見て $p, q$ の候補を絞る

      ### Step 2. Estimation (推定)

      候補モデルを最尤推定でフィットし、**AIC / BIC** で比較:

      | 規準 | 式 | 特徴 |
      |---|---|---|
      | AIC | $-2 \ln L + 2k$ | フィットと複雑度の妥協、予測重視 |
      | BIC | $-2 \ln L + k \ln n$ | AIC より罰則きつめ、簡素なモデルを選びやすい |

      ### Step 3. Diagnostic Checking (診断)

      残差が **ホワイトノイズ** になっているか確認:

      - **Ljung-Box 検定**: 残差に自己相関が残っていないか
      - **正規性 (QQ プロット)**: 残差の分布の歪み・厚いテールを確認
      - **分散一定性**: 残差の二乗の ACF を見る (残れば GARCH の出番)

      もし NG なら Step 1 に戻る (次数を見直す、対数変換する等)。

      ### Step 4. Forecasting (予測)

      `res.forecast(steps=h)` で点予測、`res.get_forecast(steps=h).conf_int()` で予測区間。
    sample_code: |
      import warnings
      warnings.filterwarnings("ignore")
      import pandas as pd
      from statsmodels.tsa.arima.model import ARIMA
      from statsmodels.stats.diagnostic import acorr_ljungbox

      df = pd.read_csv("data/macro_indicators.csv", parse_dates=["date"]).set_index("date")
      cpi = df["CPI_yoy"]

      # Step 1-2: (p, d, q) を Grid Search して AIC が最小の組合せを探す
      print("【 Step 2: Grid Search 】")
      print(f"{'(p,d,q)':10s}  {'AIC':>8s}  {'BIC':>8s}  {'LB p':>6s}")
      best = (None, float("inf"))
      for p in range(3):
          for q in range(3):
              order = (p, 1, q)
              try:
                  res = ARIMA(cpi, order=order).fit()
                  lb = acorr_ljungbox(res.resid, lags=[10], return_df=True)["lb_pvalue"].iloc[0]
                  flag = "  ←最良" if res.aic < best[1] else ""
                  print(f"{str(order):10s}  {res.aic:8.2f}  {res.bic:8.2f}  {lb:6.3f}{flag}")
                  if res.aic < best[1]:
                      best = (order, res.aic)
              except Exception as e:
                  print(f"{str(order):10s}  failed: {e}")
      print(f"\n→ AIC 最良モデル: ARIMA{best[0]}")

      # Step 4: 最良モデルで予測
      res = ARIMA(cpi, order=best[0]).fit()
      fc = res.get_forecast(steps=6)
      ci = fc.conf_int(alpha=0.05)
      print("\n【 Step 4: 次 6 か月予測 (95% 区間) 】")
      out = pd.concat([fc.predicted_mean.rename("point"), ci], axis=1).round(3)
      print(out)
    runnable: true
    stickman: explain
    stickman_speech: "Identification → Estimation → Diagnostic → Forecast、この 4 段が時系列実務の背骨だよ！"

  # ─── 4. 残差の白色化 (モデル診断) ────────────────────
  - kind: sample
    title: "残差の白色化 — Ljung-Box 検定"
    markdown: |
      ## 良いモデルとは「残差にもう説明できる構造がない」モデル

      モデル $\hat{y}_t$ をフィットした後の **残差** $\hat{\varepsilon}_t = y_t - \hat{y}_t$ がホワイトノイズに近ければ、
      時系列に含まれる構造はすべてモデルが拾えたと考えられます。これを **残差の白色化** と呼びます。

      ### Ljung-Box 検定

      残差にラグ $k$ までの自己相関がまとめてあるかを統計的に判定:

      $$ H_0: \rho_1 = \rho_2 = \dots = \rho_h = 0\ (\text{残差は白色}) $$

      ここで:
      - $H_0$ : 帰無仮説 — 「ラグ 1 から $h$ までの残差自己相関がすべて 0」
      - $\rho_k$ : ラグ $k$ の残差自己相関係数 ($k = 1, 2, \dots, h$)
      - $h$ : 検定で見る最大ラグ（実務では 10 か 20 が一般的）
      - 「白色」 = ホワイトノイズと同等という意味

      - p 値 ≥ 0.05 → 帰無採択 → **残差は白色** → モデル OK
      - p 値 < 0.05 → 帰無棄却 → **残差に自己相関が残っている** → モデル改善の余地あり (p, q を上げる等)

      ### 情報量規準 (AIC / BIC)

      モデルの次数 $(p, q)$ を比較するときは **AIC / BIC** を使うのが標準:
      - AIC = $-2 \ln L + 2k$  (フィット良さと複雑度の妥協、予測重視)
      - BIC = $-2 \ln L + k \ln n$ (AIC より罰則きつめ、簡素なモデルを選びやすい)

      ここで:
      - $L$ : モデルの最大尤度 (maximum likelihood)
      - $\ln L$ : 対数尤度（大きいほど fit が良い、よって $-2\ln L$ は小さいほど良い）
      - $k$ : 推定したパラメータの数（次数を上げると $k$ が増える）
      - $n$ : サンプルサイズ
      - **AIC・BIC とも値が小さいモデルが望ましい** ($-2\ln L$ + 罰則項の最小化）

      実務では候補モデル数個を比べて **AIC / BIC が小さい順 + 残差白色** を満たすものを採用します。
    sample_code: |
      import warnings
      warnings.filterwarnings("ignore")
      import numpy as np
      from statsmodels.tsa.arima.model import ARIMA
      from statsmodels.stats.diagnostic import acorr_ljungbox
      np.random.seed(0)

      # AR(1) の系列を生成して 3 通りのモデルでフィット比較
      y = np.zeros(300)
      for t in range(1, 300):
          y[t] = 0.7 * y[t-1] + np.random.normal()

      candidates = [(1, 0, 0), (2, 0, 0), (1, 0, 1)]
      print("order      AIC      BIC     LjungBox(p)")
      for order in candidates:
          res = ARIMA(y, order=order).fit()
          lb = acorr_ljungbox(res.resid, lags=[10], return_df=True)["lb_pvalue"].iloc[0]
          print(f"{str(order):10s} {res.aic:7.2f}  {res.bic:7.2f}   {lb:.3f}")
      # AIC / BIC 最小かつ Ljung-Box p>0.05 のモデルが良いモデル
    runnable: true
    stickman: explain
    stickman_speech: "AIC で素早く絞り、Ljung-Box で残差が白いかを確認、この 2 段ロケットが定石。"

  # ─── 5. ARIMA 係数の読み方 ──────────────────────────
  - kind: sample
    title: "ARIMA 係数の読み方"
    markdown: |
      ## statsmodels の summary 出力をどう読むか

      `ARIMA.fit().summary()` の係数表には次の項目が並びます。一度しっかり読めるようになると、
      モデルから実務的な含意を引き出せるようになります。

      ### 主な行の意味

      | ラベル | 何を表すか | 典型的な値 |
      |---|---|---|
      | **const** (or `intercept`) | 定数項 $c$ — 系列の長期平均（差分済なら、トレンド傾き） | データに依存 |
      | **ar.L1** | AR 1 次の係数 $\phi_1$ — 過去 1 期の自己ショックの引きずり | $-1 < \phi_1 < 1$ |
      | **ar.L2** | AR 2 次の係数 $\phi_2$ | 同上 |
      | **ma.L1** | MA 1 次の係数 $\theta_1$ — 過去 1 期の予測誤差の引きずり | 同上 |
      | **sigma2** | 残差分散 $\sigma^2$ — モデルが説明しきれない分のばらつき | 系列により様々 |

      ### 各列の意味

      | 列 | 説明 |
      |---|---|
      | **coef** | 推定値 (= 点推定) |
      | **std err** | 標準誤差 — 推定の不確実性 |
      | **z** | 標準化係数 ($= \text{coef} / \text{std err}$) — 帰無仮説「係数 = 0」のもとでの統計量 |
      | **P>|z|** (p 値) | 「係数が 0 ではない」と言える信頼性。**< 0.05 で有意** |
      | **[0.025 0.975]** | 95% 信頼区間 — 区間が 0 を跨ぐ係数は実質的に 0 と区別できない |

      ### 有意性の解釈

      - p 値 < 0.05 → 係数 は 0 ではない（モデルに寄与している）
      - p 値 ≥ 0.05 → 係数 は 0 とほぼ等しい → その次数は **削っても良い**

      たとえば ARIMA(2, 1, 0) で ar.L2 の p 値が 0.4 なら、ar.L2 は実質効いていない →
      ARIMA(1, 1, 0) に減らした方が **シンプルで AIC も改善する可能性大**。

      ### AR(1) 係数の金融的解釈

      - **$\phi_1 \approx 0$**: モデルが構造を見つけられていない → 系列は実質的にランダム
      - **$\phi_1 \approx 0.3$**: 弱い慣性 — 株式市場の日次リターンに時々見られる
      - **$\phi_1 \approx 0.9$**: 強い慣性 / 平均回帰 — 金利スプレッド、ボラティリティ指数
      - **$\phi_1 \approx 1$**: 単位根 → そもそも差分が足りなかった可能性
    sample_code: |
      import warnings
      warnings.filterwarnings("ignore")
      import numpy as np
      from statsmodels.tsa.arima.model import ARIMA
      np.random.seed(0)

      # AR(1) φ = 0.7 の系列で ARIMA(1, 0, 1) を推定
      y = np.zeros(400)
      for t in range(1, 400):
          y[t] = 0.7 * y[t-1] + np.random.normal()

      res = ARIMA(y, order=(1, 0, 1)).fit()
      print(res.summary().tables[1])
      print()
      # コードから直接アクセスする場合
      print(f"AR 係数 φ1 = {res.params.get('ar.L1', float('nan')):.3f}  (真値 0.7)")
      print(f"MA 係数 θ1 = {res.params.get('ma.L1', float('nan')):.3f}  (真値 0.0 — 無意味な MA 項)")
      print(f"残差 σ²    = {res.params['sigma2']:.3f}")
      print()
      # 各係数の p 値
      print("p 値 (< 0.05 で有意):")
      for name, pval in res.pvalues.items():
          flag = "  ←有意" if pval < 0.05 else "  ←有意でない"
          print(f"  {name:10s}: {pval:.4f}{flag}")
    runnable: true
    stickman: explain
    stickman_speech: "p 値で各係数の必要性を判定 → 不要な次数を削る、というのが summary を読むときの基本姿勢！"

  # ─── 6. 予測区間と SARIMA ──────────────────────────
  - kind: sample
    title: "予測区間 — 不確実性を時間で見る"
    markdown: |
      ## 点予測ではなく「区間」で予測する

      時系列モデルは将来値を **一つの数** で返しますが、それは予測の **中央値（の推定）** にすぎません。
      実務で重要なのは **どれくらい外れる可能性があるか**、つまり予測区間 (prediction interval) です。

      ### 95% 予測区間の意味

      $$ [\hat{y}_{T+h} - 1.96 \cdot \sigma_h,\ \ \hat{y}_{T+h} + 1.96 \cdot \sigma_h] $$

      ここで:
      - $T$ : 最新の観測時点（トレーニングデータの末尾）
      - $h$ : 予測ホライズン (forecast horizon)、「$h$ ステップ先」を予測する
      - $\hat{y}_{T+h}$ : $T+h$ 時点の **点予測** (point forecast)
      - $\sigma_h$ : $h$ ステップ先予測の **標準誤差** (forecast standard error)
      - $1.96$ : 標準正規分布の上側 2.5% 点（両側 95% 信頼区間に対応）

      重要な性質: **予測ホライズン $h$ が増えるほど $\sigma_h$ も増える** ので、予測区間は時間と共に広がります。

      ### AR(1) の予測分散の漸近

      AR(1) $|\phi| < 1$ では:

      $$ \mathrm{Var}(\hat{y}_{T+h}) = \sigma^2 \cdot \dfrac{1 - \phi^{2h}}{1 - \phi^2} $$

      ここで:
      - $\mathrm{Var}(\hat{y}_{T+h})$ : $h$ ステップ先予測の分散（$= \sigma_h^2$）
      - $\sigma^2$ : イノベーション（誤差項 $\varepsilon_t$）の分散
      - $\phi$ : AR(1) 係数
      - $h$ : 予測ホライズン

      $h \to \infty$ で $\dfrac{\sigma^2}{1 - \phi^2}$ (定常分布の分散) に収束。
      → **遠い将来の予測区間は「定常分布の範囲」に頭打ちする**。

      ランダムウォーク ($\phi = 1$) では分散が線形に発散 → 区間が永遠に広がる。

      ## SARIMA — 季節 ARIMA の概要

      月次・四半期データには **季節性** (周期 12 や 4) が含まれることが多い。
      これを扱うのが **SARIMA(p, d, q)(P, D, Q)$_s$**:

      | 引数 | 意味 |
      |---|---|
      | `order=(p, d, q)` | 非季節部分（通常 ARIMA と同じ）|
      | `seasonal_order=(P, D, Q, s)` | 季節部分: 季節 AR の次数 $P$、季節差分 $D$、季節 MA の次数 $Q$、周期 $s$ |

      ### 典型例

      - **月次 CPI** で「12 か月前と相関がある」: `SARIMAX(cpi, order=(1,1,1), seasonal_order=(1,1,1,12))`
      - **四半期 GDP** で「前年同期と相関がある」: 周期 $s = 4$
      - **日次気温** で「年間サイクルがある」: 周期 $s = 365$

      ### 季節差分

      $$ \Delta_{12} y_t = y_t - y_{t-12} $$

      ここで:
      - $\Delta_{12}$ : 周期 12 の季節差分演算子（12 期前との差を取る）
      - $y_t$ : 時刻 $t$ の値
      - $y_{t-12}$ : 12 期前（月次データなら前年同月）の値
      - 一般化: $\Delta_s y_t = y_t - y_{t-s}$ ($s$ は周期)

      これで「前年同月との差」を取り、季節成分を除去 → 残差を SARIMA で扱う。
    sample_code: |
      import warnings
      warnings.filterwarnings("ignore")
      import pandas as pd
      import numpy as np
      from statsmodels.tsa.arima.model import ARIMA

      df = pd.read_csv("data/macro_indicators.csv", parse_dates=["date"]).set_index("date")
      cpi = df["CPI_yoy"]

      # ARIMA(1, 1, 1) を当てて 12 か月先まで点予測 + 95% 区間
      res = ARIMA(cpi, order=(1, 1, 1)).fit()
      fc = res.get_forecast(steps=12)
      mean = fc.predicted_mean
      ci   = fc.conf_int(alpha=0.05)

      out = pd.DataFrame({
          "point":  mean.round(3).values,
          "lower":  ci.iloc[:, 0].round(3).values,
          "upper":  ci.iloc[:, 1].round(3).values,
      }, index=pd.RangeIndex(1, 13, name="h"))
      out["width"] = (out["upper"] - out["lower"]).round(3)
      print("【 ホライズン h ごとの予測と 95% 区間 】")
      print(out)
      print()
      print(f"→ width が h と共に広がるのが時系列予測の本質的性質")
      print(f"  h=1 区間幅: {out.loc[1,'width']:.3f}")
      print(f"  h=12 区間幅: {out.loc[12,'width']:.3f}  ({out.loc[12,'width']/out.loc[1,'width']:.1f} 倍に拡大)")
    runnable: true
    stickman: explain
    stickman_speech: "予測は「点」だけでは不十分。区間を見ないと判断を誤るよ！"

  # ─── 演習 1: AR(1) 系列生成 ──────────────────────────
  - kind: exercise
    title: "AR(1) 系列を生成しよう"
    prompt: |
      `arma_generate_sample` を使って **$\phi = 0.5$** の AR(1) サンプルを 200 個生成してください。

      **注意**: statsmodels では AR 多項式を **`[1, -φ]`** の符号反転形式で指定します。
      これは AR モデルを「ラグ多項式」$1 - \phi L = 0$ の係数列として表現する慣習に由来します。
      $\phi = 0.5$ なら **`[1, -0.5]`** を渡します。
    code_template: |
      import numpy as np
      from statsmodels.tsa.arima_process import arma_generate_sample
      np.random.seed(0)
      ar_params = np.array([1, {{slot:phi}}])
      y = arma_generate_sample(ar_params, np.array([1]), nsample=200)
      print(round(float(y.std()), 3))
    blanks:
      - id: phi
        canonical_answer: "-0.5"
        accept_patterns:
          - '^-0\.5$'
          - '^-\s*0\.5$'
        hint: "AR 多項式は [1, -φ] の形なので、φ=0.5 なら -0.5"
    test_cases:
      - kind: stdout_regex
        pattern: '^1\.\d+\s*$'
    hints:
      - "AR 多項式の符号は逆になる。"
      - "`-0.5` を入れる。"
    stickman_feedback:
      correct: "AR の係数指定、これでマスター。"
      wrong_hint1: "符号反転に注意。"
      wrong_hint2: "`-0.5`"
      wrong_hint3: "`-0.5`"

