id: 23
title: "時系列モデル"
phase: D
prerequisites: [15, 17]
learning_goals:
  - "時系列データの自己相関を観察できる"
  - "statsmodels で AR / ARMA モデルを推定できる"
  - "残差の白色化を理解する"

pages:
  - kind: sample
    title: "AR(1) モデル"
    markdown: |
      ## 自己回帰モデル

      $$ y_t = \phi\, y_{t-1} + \varepsilon_t,\quad \varepsilon_t \sim \mathcal{N}(0,\sigma^2) $$

      - $\phi$ (ファイ) は **過去の値をどれだけ引きずるか** を決める係数 ($|\phi| < 1$ で定常)
      - $\phi$ が **1 に近いほど** 過去の値を強く引きずる (ランダムウォークに近づく)
      - $\phi$ が **0 に近いほど** 過去とは独立 (ホワイトノイズに近づく)
      - $\varepsilon_t$ はホワイトノイズ (平均 0 の独立な誤差項)

      statsmodels で簡単に推定できます。
    sample_code: |
      import numpy as np
      from statsmodels.tsa.arima_process import arma_generate_sample
      np.random.seed(42)
      ar_params = np.array([1, -0.7])    # φ = 0.7
      ma_params = np.array([1])
      y = arma_generate_sample(ar_params, ma_params, nsample=100)
      print("生成されたパス [先頭 5]:", y[:5].round(3))
      print("平均:", round(y.mean(), 4))
    runnable: true
    stickman: explain
    stickman_speech: "AR(1) は時系列の入門に最適。"

  - kind: sample
    title: "ACF で自己相関を見る"
    markdown: |
      自己相関関数 (ACF) は「時刻 t の値と t-k の値の相関」を、
      ラグ k ごとに計算したもの。AR(1) なら指数的に減衰します。
    sample_code: |
      import numpy as np
      from statsmodels.tsa.stattools import acf
      np.random.seed(0)
      y = np.random.normal(0, 1, 200)
      # AR(1) っぽく作る
      for i in range(1, len(y)):
          y[i] = 0.7 * y[i-1] + np.random.normal()
      lags = acf(y, nlags=5)
      print(lags.round(3))
    runnable: true
    stickman: explain
    stickman_speech: "ラグ 0 が 1.0、それ以降が小さくなっていけば良いモデル。"

  - kind: exercise
    title: "AR(1) 系列を生成しよう"
    prompt: |
      `arma_generate_sample` を使って **$\phi = 0.5$** の AR(1) サンプルを 200 個生成してください。

      **注意**: statsmodels では AR 多項式を **`[1, -φ]`** の符号反転形式で指定します。
      これは AR モデルを「ラグ多項式」$1 - \phi L = 0$ の係数列として表現する慣習に由来します。
      $\phi = 0.5$ なら **`[1, -0.5]`** を渡します。
    code_template: |
      import numpy as np
      from statsmodels.tsa.arima_process import arma_generate_sample
      np.random.seed(0)
      ar_params = np.array([1, {{slot:phi}}])
      y = arma_generate_sample(ar_params, np.array([1]), nsample=200)
      print(round(float(y.std()), 3))
    blanks:
      - id: phi
        canonical_answer: "-0.5"
        accept_patterns:
          - '^-0\.5$'
          - '^-\s*0\.5$'
        hint: "AR 多項式は [1, -φ] の形なので、φ=0.5 なら -0.5"
    test_cases:
      - kind: stdout_regex
        pattern: '^1\.\d+\s*$'
    hints:
      - "AR 多項式の符号は逆になる。"
      - "`-0.5` を入れる。"
    stickman_feedback:
      correct: "AR の係数指定、これでマスター。"
      wrong_hint1: "符号反転に注意。"
      wrong_hint2: "`-0.5`"
      wrong_hint3: "`-0.5`"

  - kind: exercise
    title: "ACF を計算しよう"
    prompt: |
      生成した系列 `y` の自己相関を **ラグ 5** まで計算してください。
    code_template: |
      import numpy as np
      from statsmodels.tsa.stattools import {{slot:fn}}
      np.random.seed(0)
      y = np.random.normal(0, 1, 200)
      for i in range(1, len(y)):
          y[i] = 0.7 * y[i-1] + np.random.normal()
      vals = {{slot:fn}}(y, nlags={{slot:lag}})
      print(len(vals))
    blanks:
      - id: fn
        canonical_answer: "acf"
        accept_patterns: ['^acf$']
        hint: "自己相関関数"
      - id: lag
        canonical_answer: "5"
        accept_patterns: ['^5$']
        hint: "ラグ 5"
    test_cases:
      - kind: stdout_regex
        pattern: '^6\s*$'
    hints:
      - "関数名 + ラグ数 5。"
      - "`acf` と `5`。"
    stickman_feedback:
      correct: "ACF はモデル選択の重要な指標。"
      wrong_hint1: "関数名は acf。"
      wrong_hint2: "`acf` と `5`。"
      wrong_hint3: "`acf` と `5`。"

  - kind: exercise
    title: "ARIMA でモデル推定しよう"
    prompt: |
      AR(1) の系列 `y` から `ARIMA(1, 0, 0)` を推定してください。
      `order=(p, d, q)` の `p=1, d=0, q=0` が AR(1) を意味します。
    code_template: |
      import numpy as np
      from statsmodels.tsa.arima.model import ARIMA
      np.random.seed(0)
      y = np.random.normal(0, 1, 200)
      for i in range(1, len(y)):
          y[i] = 0.7 * y[i-1] + np.random.normal()
      model = ARIMA(y, order=({{slot:p}}, {{slot:d}}, {{slot:q}}))
      result = model.fit()
      print("AR(1) 係数:", round(float(result.params[0]), 2))
    blanks:
      - id: p
        canonical_answer: "1"
        accept_patterns: ['^1$']
      - id: d
        canonical_answer: "0"
        accept_patterns: ['^0$']
      - id: q
        canonical_answer: "0"
        accept_patterns: ['^0$']
    test_cases:
      - kind: stdout_regex
        pattern: 'AR\(1\) 係数:'
    hints:
      - "AR(1) は (p,d,q) = (1, 0, 0)。"
      - "`1`, `0`, `0`。"
    stickman_feedback:
      correct: "ARIMA の order を決めれば、ほぼ呼ぶだけ。"
      wrong_hint1: "(1, 0, 0) を指定。"
      wrong_hint2: "`1`, `0`, `0`。"
      wrong_hint3: "`1`, `0`, `0`。"

  # ─── 参考実装 ①: CPI に ARIMA(1,1,1) ─────────────────
  - kind: sample
    title: "参考実装 — マクロデータに ARIMA を当てる"
    markdown: |
      ## ARIMA(p, d, q) の各次数の意味

      | 次数 | 何を表すか | よく使う値 |
      |---|---|---|
      | **p** | AR (Auto-Regressive) の次数 — 過去の値で説明 | 1-3 |
      | **d** | 差分の階数 — 単位根を消す | **1** が圧倒的 (1 階差で定常化が多い) |
      | **q** | MA (Moving Average) の次数 — 過去の誤差で説明 | 1-3 |

      **業界の作法**:
      1. **ADF 検定** で単位根を見る → 1 階差で定常化するか確認 (d=1 が多い)
      2. ACF / PACF プロットで p / q の候補を絞る
      3. AIC / BIC が最小の組み合わせを選ぶ (Grid Search)
      4. 残差が白色雑音か Ljung-Box 検定で確認

      この Sample は CPI 年率変化に ARIMA(1,1,1) を当て、フィット結果と次 6 か月予測を出します。
    sample_code: |
      import warnings
      warnings.filterwarnings("ignore")
      import pandas as pd
      import numpy as np
      from statsmodels.tsa.arima.model import ARIMA

      df = pd.read_csv("data/macro_indicators.csv", parse_dates=["date"]).set_index("date")
      cpi = df["CPI_yoy"]

      model = ARIMA(cpi, order=(1, 1, 1))
      res = model.fit()
      print(res.summary().tables[1])

      forecast = res.forecast(steps=6)
      print("\n--- 次 6 か月の CPI YoY 予測 ---")
      print(forecast.round(3))
    runnable: true
    stickman: explain
    stickman_speech: "ARIMA は時系列の入門にして実務頻出。差分階数 d をどう取るかがすべての始まり。"

  # ─── 参考実装 ②: ADF 検定で単位根を確認 ─────────────────
  - kind: sample
    title: "参考実装 — ADF 検定で定常性を判定"
    markdown: |
      ## 「差分を取るべきか」を統計的に判断する

      ARIMA の `d` (差分階数) を決める前に、**Augmented Dickey-Fuller (ADF) 検定**で
      系列が単位根を持つか（=非定常か）を確認します。

      $$ H_0: \text{単位根あり (非定常)},\quad H_1: \text{定常} $$

      **判断**:
      - p 値 < 0.05 → 帰無棄却 → **定常** → 差分不要 (`d=0`)
      - p 値 ≥ 0.05 → 棄却できない → **非定常** → 1 階差を取って再検定 (`d=1`)
      - それでもダメなら 2 階差 (`d=2`) — まれ

      **業界での注意**:
      - **株価そのもの** はほぼ常に非定常 (d=1 が必要)
      - **株価リターン** はほぼ常に定常 (d=0 で OK)
      - 金利・CPI などマクロは判断が分かれる → ADF 必須
    sample_code: |
      import warnings
      warnings.filterwarnings("ignore")
      import pandas as pd
      from statsmodels.tsa.stattools import adfuller

      df = pd.read_csv("data/macro_indicators.csv", parse_dates=["date"]).set_index("date")
      cpi = df["CPI_yoy"]

      def report(series, name: str) -> None:
          stat, p, *_ = adfuller(series.dropna())
          verdict = "定常 (棄却 ○)" if p < 0.05 else "非定常 (棄却 ×)"
          print(f"{name:20s}: ADF stat={stat:7.3f}  p={p:.4f}  {verdict}")

      report(cpi, "CPI level")
      report(cpi.diff(), "CPI 1st diff")
      # 比較: 株価 (大抵 d=1 が必要)
      px = pd.read_csv("data/stocks_daily.csv", parse_dates=["date"]).set_index("date")["AAPL_jp"]
      report(px, "Stock price level")
      report(px.pct_change(), "Stock returns")
    runnable: true
    expected_output: "ADF stat"
    stickman: explain
    stickman_speech: "差分を取るかは「迷ったら ADF」。これを習慣化すると時系列の取り扱いが安定する。"
