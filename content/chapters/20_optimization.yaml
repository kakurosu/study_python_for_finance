id: 20
title: "ポートフォリオ最適化"
phase: C
prerequisites: [18, 19]
learning_goals:
  - "2 銘柄ポートフォリオの分散を計算できる"
  - "scipy.optimize.minimize で最小分散ポートフォリオを求める"
  - "等式制約 (重み合計 = 1) と不等式制約 (空売り禁止) を扱える"

pages:
  - kind: sample
    title: "ポートフォリオの分散"
    markdown: |
      ## 2 銘柄ポートフォリオの分散

      重み $w_1, w_2$ (合計 1) のポートフォリオ分散は:

      $$ \mathrm{Var}(p) = w_1^2 \sigma_1^2 + w_2^2 \sigma_2^2 + 2 w_1 w_2 \rho \sigma_1 \sigma_2 $$

      ここで:
      - $w_1, w_2$ : 各銘柄への投資比率（重み、$w_1 + w_2 = 1$）
      - $\sigma_1, \sigma_2$ : 各銘柄リターンの標準偏差
      - $\rho = \rho_{12}$ : 2 銘柄リターン間の相関係数（$-1 \le \rho \le 1$）
      - $\mathrm{Var}(p)$ : ポートフォリオリターンの分散

      行列形式で書くと $n$ 銘柄に一般化できます:

      $$ \mathrm{Var}(p) = \mathbf{w}^\top \Sigma\, \mathbf{w} $$

      ここで:
      - $\mathbf{w}$ : $n \times 1$ の重みベクトル ($\sum_i w_i = 1$)
      - $\mathbf{w}^\top$ : $\mathbf{w}$ の転置
      - $\Sigma$ : $n \times n$ の **共分散行列** (対称行列、$(i,j)$ 要素は $\mathrm{Cov}(r_i, r_j)$)
      - 結果はスカラー（ポートフォリオ分散）

      第 3 項の $2 w_1 w_2 \rho \sigma_1 \sigma_2$ がポートフォリオ理論の **「分散効果」** の源泉 — $\rho < 1$ ならリスクが減ります。
    sample_code: |
      import numpy as np
      sigma = np.array([0.20, 0.12])
      corr = 0.30
      cov = np.array([
          [sigma[0]**2,           corr*sigma[0]*sigma[1]],
          [corr*sigma[0]*sigma[1], sigma[1]**2],
      ])
      w = np.array([0.5, 0.5])
      port_var = w @ cov @ w
      port_vol = np.sqrt(port_var)
      print("分散     :", round(port_var, 6))
      print("標準偏差 :", round(port_vol, 4))
    runnable: true
    stickman: explain
    stickman_speech: "@ は行列積。numpy で `wᵀΣw` を 1 行で書けるよ！"

  - kind: sample
    title: "scipy で最小分散ポートフォリオ"
    markdown: |
      ## scipy.optimize.minimize
      目的関数（最小化したい関数）と制約を渡すと、最適な重みを返してくれます。
      - **等式制約**: `{'type': 'eq', 'fun': lambda w: w.sum() - 1}` (重み合計 = 1)
      - **境界**: `bounds=[(0, 1), (0, 1)]` (空売り禁止)
    sample_code: |
      import numpy as np
      from scipy.optimize import minimize
      cov = np.array([[0.04, 0.0072], [0.0072, 0.0144]])

      def port_var(w):
          return w @ cov @ w

      cons = [{'type': 'eq', 'fun': lambda w: w.sum() - 1}]
      bnds = [(0, 1), (0, 1)]
      res = minimize(port_var, [0.5, 0.5], bounds=bnds, constraints=cons)
      print("最適重み     :", res.x.round(4))
      print("最小標準偏差 :", round(np.sqrt(res.fun), 4))
    runnable: true
    stickman: explain
    stickman_speech: "Markowitz 理論 by scipy！"

  - kind: exercise
    title: "ポートフォリオ分散を計算しよう"
    prompt: |
      共分散行列 $\Sigma$ (`cov`) と重みベクトル $\mathbf{w}$ (`w`) から、ポートフォリオ分散を計算してください:

      $$ \mathrm{Var}(p) = \mathbf{w}^\top \Sigma\, \mathbf{w} $$

      Python では `@` 演算子で行列積を取れます。`w @ cov @ w` は左から順に「ベクトル × 行列」「ベクトル × ベクトル」と計算され、結果はスカラーになります。
    code_template: |
      import numpy as np
      cov = np.array([[0.04, 0.0072], [0.0072, 0.0144]])
      w = np.array([0.6, 0.4])
      port_var = {{slot:expr}}
      print(round(float(port_var), 6))
    blanks:
      - id: expr
        canonical_answer: "w @ cov @ w"
        accept_patterns:
          - '^w\s*@\s*cov\s*@\s*w$'
        hint: "wᵀ Σ w を @ で書く"
    test_cases:
      - kind: stdout_regex
        pattern: '^0\.02016\s*$'
    hints:
      - "行列積は `@`。"
      - "`w @ cov @ w`"
    stickman_feedback:
      correct: "ポートフォリオ分散の公式、覚えたね！"
      wrong_hint1: "`w @ cov @ w`"
      wrong_hint2: "`w @ cov @ w`"
      wrong_hint3: "`w @ cov @ w`"

  - kind: exercise
    title: "目的関数（最小化したい関数）を定義しよう"
    prompt: |
      重み `w` を受け取ってポートフォリオ分散を返す **lambda** を定義してください。
    code_template: |
      import numpy as np
      cov = np.array([[0.04, 0.0072], [0.0072, 0.0144]])
      port_var = lambda {{slot:arg}}: {{slot:body}}
      print(round(port_var(np.array([0.5, 0.5])), 6))
    blanks:
      - id: arg
        canonical_answer: "w"
        accept_patterns: ['^[A-Za-z_]\w*$']
        hint: "重みベクトルを表す引数名"
      - id: body
        canonical_answer: "w @ cov @ w"
        accept_patterns:
          - '^[A-Za-z_]\w*\s*@\s*cov\s*@\s*[A-Za-z_]\w*$'
        hint: "wᵀ Σ w"
    test_cases:
      - kind: stdout_regex
        pattern: '^0\.0172\s*$'
    hints:
      - "lambda の引数を 1 つ。"
      - "本体は `w @ cov @ w`。"
    stickman_feedback:
      correct: "scipy に渡せる目的関数のできあがり！"
      wrong_hint1: "`w` と `w @ cov @ w`。"
      wrong_hint2: "`w` と `w @ cov @ w`。"
      wrong_hint3: "`w` と `w @ cov @ w`。"

  - kind: exercise
    title: "等式制約を書こう"
    prompt: |
      `scipy.optimize.minimize` に渡す **「重み合計 = 1」** の等式制約を完成させてください。
    code_template: |
      import numpy as np
      from scipy.optimize import minimize
      cov = np.array([[0.04, 0.0072], [0.0072, 0.0144]])
      port_var = lambda w: w @ cov @ w
      cons = [{'type': {{slot:type}}, 'fun': lambda w: w.sum() - 1}]
      bnds = [(0, 1), (0, 1)]
      res = minimize(port_var, [0.5, 0.5], bounds=bnds, constraints=cons)
      print(res.x.round(2))
    blanks:
      - id: type
        canonical_answer: "'eq'"
        accept_patterns:
          - "^'eq'$"
          - '^"eq"$'
        hint: "等式制約は 'eq'"
    test_cases:
      - kind: stdout_regex
        pattern: '\[0\.18 0\.82\]'
    hints:
      - "等式は 'eq'、不等式は 'ineq'。"
      - "`'eq'`"
    stickman_feedback:
      correct: "Markowitz 最小分散ポートフォリオ完成！"
      wrong_hint1: "`'eq'`"
      wrong_hint2: "`'eq'`"
      wrong_hint3: "`'eq'`"

  # ─── 参考実装 ①: 効率的フロンティアを描く ────────────────
  - kind: sample
    title: "参考実装 — 効率的フロンティア (Markowitz)"
    markdown: |
      ## 「リスク と リターン の最良トレードオフ」を線で描く

      Markowitz の最適化問題:

      $$ \min_{\mathbf{w}}\ \mathbf{w}^\top \Sigma \mathbf{w} \quad \text{s.t.}\ \mathbf{w}^\top \mu = \mu_{\text{target}},\ \sum w_i = 1 $$

      ターゲット期待リターン $\mu_{\text{target}}$ を動かして繰り返し解くと、
      **(リスク, リターン) の平面に下に凸の曲線** が描けます。これが **効率的フロンティア**。

      **業界の使い方**:
      - 顧客のリスク許容度に合わせて「フロンティア上の最適点」を提案
      - **接線ポートフォリオ** (リスクフリー線と接する点) が最大 Sharpe
      - **GMV ポートフォリオ** (最小分散) がフロンティア左端

      **批判点（業界の常識）**:
      - 共分散・期待リターンの **推定誤差に極端に弱い** (Michaud の指摘)
      - 結果は短期データで激しく揺れる → ロバスト最適化 / Black-Litterman で補強
    sample_code: |
      import numpy as np
      import pandas as pd
      from scipy.optimize import minimize
      import matplotlib.pyplot as plt

      df = pd.read_csv("data/returns_monthly.csv", index_col="YearMonth")
      mu = df.mean().values * 12               # 年率期待リターン
      Sigma = df.cov().values * 12             # 年率共分散
      n = len(mu)

      def port_vol(w):
          return float(np.sqrt(w @ Sigma @ w))

      def neg_port_ret(w):
          return -float(w @ mu)

      # 効率的フロンティア: target リターンを走査して最小分散を求める
      targets = np.linspace(mu.min(), mu.max(), 25)
      vols, rets = [], []
      bounds = [(0, 1)] * n     # ロングオンリー
      for t in targets:
          cons = [
              {"type": "eq", "fun": lambda w: np.sum(w) - 1},
              {"type": "eq", "fun": lambda w, t=t: w @ mu - t},
          ]
          x0 = np.ones(n) / n
          res = minimize(port_vol, x0, method="SLSQP", bounds=bounds, constraints=cons)
          if res.success:
              vols.append(port_vol(res.x))
              rets.append(t)

      fig, ax = plt.subplots(figsize=(7, 5))
      ax.plot(vols, rets, color="crimson", linewidth=2, label="Efficient Frontier")
      # 個別資産もプロット
      for i, name in enumerate(df.columns):
          ax.scatter(np.sqrt(Sigma[i, i]), mu[i], s=60)
          ax.annotate(name, (np.sqrt(Sigma[i, i]), mu[i]), fontsize=9,
                      xytext=(5, 5), textcoords="offset points")
      ax.set_xlabel("Annualised Volatility")
      ax.set_ylabel("Annualised Return")
      ax.set_title("Efficient Frontier (long-only, 6 assets)")
      ax.grid(True, alpha=0.3)
      ax.legend()
      fig.tight_layout()
      plt.show()
    runnable: true
    stickman: explain
    stickman_speech: "曲線の上にある点だけが「効率的」。個別資産は曲線より右下、つまり非効率。"

  # ─── 参考実装 ②: リスクパリティ ─────────────────────────
  - kind: sample
    title: "参考実装 — リスクパリティ（業界の対立アプローチ）"
    markdown: |
      ## Markowitz の批判から生まれた「リスク均等配分」

      Markowitz は **期待リターン** に依存しますが、これは推定が非常に難しい。
      そこで Bridgewater の Ray Dalio らが提唱したのが **リスクパリティ**:

      - 期待リターンは **使わない**
      - 代わりに **全資産のリスク寄与 (component contribution) を均等** にする
      - 結果として、低ボラティリティ資産 (債券など) が **大きなウェイト** を持つ

      最適化問題:

      $$ \min_{\mathbf{w}}\ \sum_{i=1}^{n} \left( \frac{w_i (\Sigma \mathbf{w})_i}{\mathbf{w}^\top \Sigma \mathbf{w}} - \frac{1}{n} \right)^2 $$

      **業界での位置づけ**:
      - All Weather (Bridgewater) や Risk Parity ETF の中心戦略
      - 「**マクロ局面に頑健**」と評価される一方、低金利環境ではレバレッジ依存に
      - Markowitz と並んで覚えておくべき 2 大アプローチ
    sample_code: |
      import numpy as np
      import pandas as pd
      from scipy.optimize import minimize

      df = pd.read_csv("data/returns_monthly.csv", index_col="YearMonth")
      Sigma = df.cov().values * 12
      n = Sigma.shape[0]
      target = np.ones(n) / n   # 各資産のリスク寄与を 1/n に

      def risk_contrib(w):
          port_var = float(w @ Sigma @ w)
          mcr = Sigma @ w
          return (w * mcr) / port_var

      def loss(w):
          return float(np.sum((risk_contrib(w) - target) ** 2))

      x0 = np.ones(n) / n
      cons = [{"type": "eq", "fun": lambda w: np.sum(w) - 1}]
      bounds = [(1e-4, 1.0)] * n
      res = minimize(loss, x0, method="SLSQP", bounds=bounds, constraints=cons)
      w_rp = res.x

      print("Risk-Parity weights:")
      for name, w in zip(df.columns, w_rp):
          print(f"  {name:12s}: {w*100:6.2f}%")
      print(f"\nLoss (smaller is better): {loss(w_rp):.6f}")
      print("Risk contribution share:")
      for name, c in zip(df.columns, risk_contrib(w_rp)):
          print(f"  {name:12s}: {c*100:6.2f}%")
    runnable: true
    stickman: explain
    stickman_speech: "期待リターンに頼らないのがミソ。Bridgewater が世界最大ヘッジファンドになった戦略。"
