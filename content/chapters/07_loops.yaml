id: 7
title: "ループ (for / while)"
phase: A
prerequisites: [6]
learning_goals:
  - "for 文でリストを順に処理できる"
  - "range() で連番を作れる"
  - "break / continue で制御できる"

pages:
  - kind: sample
    title: "for 文と range"
    markdown: |
      ## 繰り返し
      Python では `for 変数 in シーケンス:` でリストや range を順に処理します。
      `range(n)` は 0 から n-1 までの整数を返します。
    sample_code: |
      total = 0
      for i in range(5):
          total += i
      print(total)
    runnable: true
    expected_output: "10"
    stickman: explain
    stickman_speech: "range(5) は 0,1,2,3,4 を順に返すよ。"

  - kind: exercise
    title: "リスト全部の合計を計算しよう"
    prompt: |
      `for 変数 in シーケンス:` の構文で、リスト・タプル・range などを **1 要素ずつ取り出して処理** できます。

      ```python
      for r in returns:    # returns の各要素を r に入れて
          print(r)         # 中身の処理を実行
      ```

      実際の合計はこの章の例題のように **アキュムレータパターン**（外で 0 初期化、ループ内で `+=`）が定番。後の章で見る `sum()` は内部でこの処理をしているだけです。
    code_template: |
      returns = [0.01, -0.005, 0.02, 0.0, -0.01]
      total = 0
      for {{slot:var}} in {{slot:iter}}:
          total += r
      print(round(total, 4))
    blanks:
      - id: var
        placeholder: "変数名"
        width: 8
        accept_patterns:
          - '^r$'
        canonical_answer: "r"
        hint: "ループ変数は `r` とする"
      - id: iter
        placeholder: "イテラブル"
        width: 12
        accept_patterns:
          - '^returns$'
        canonical_answer: "returns"
        hint: "リスト名 returns をそのまま"
    test_cases:
      - kind: stdout_regex
        pattern: '^0\.015\s*$'
      - kind: namespace_check
        asserts:
          - "abs(total - 0.015) < 1e-6"
    hints:
      - "`for 変数 in シーケンス:` の形だよ。"
      - "`r` と `returns` を入れてね。"
    stickman_feedback:
      correct: "ループでリストを処理するのは基本中の基本！"
      wrong_hint1: "ループ変数とリスト名を入れよう。"
      wrong_hint2: "`r` と `returns` だね。"
      wrong_hint3: "答えは `r` と `returns`。"

  - kind: exercise
    title: "勝率（プラスのリターン日数の割合）を計算しよう"
    prompt: |
      **勝率（hit ratio）** はファンドの安定性を見る基本指標。`勝った日数 / 全日数` で算出します。

      ループ内で `if` を使うのが定番パターン:
      ```python
      win = 0
      for r in returns:
          if r > 0:
              win += 1
      ```

      ループと条件分岐の組み合わせで「**条件を満たす要素を数える**」処理が書けるようになると、データ分析の基礎が完成します。
    code_template: |
      returns = [0.01, -0.02, 0.005, -0.01, 0.012, 0.0, 0.008]
      win = 0
      for r in returns:
          if r {{slot:cond}}:
              {{slot:body}}
      print(round(win / len(returns), 4))
    blanks:
      - id: cond
        placeholder: "比較"
        width: 8
        accept_patterns:
          - '^>\s*0$'
        canonical_answer: "> 0"
        hint: "正は > 0"
      - id: body
        placeholder: "増加"
        width: 12
        accept_patterns:
          - '^win\s*\+=\s*1$'
          - '^win\s*=\s*win\s*\+\s*1$'
        canonical_answer: "win += 1"
        hint: "win に 1 を足す"
    test_cases:
      - kind: stdout_regex
        pattern: '^0\.5714\s*$'
    hints:
      - "条件が True のとき win に 1 を足す。"
      - "`> 0` と `win += 1` を使うよ。"
    stickman_feedback:
      correct: "勝率はパフォーマンス分析の定番指標だよ！"
      wrong_hint1: "条件は `> 0`、本体は `win += 1`。"
      wrong_hint2: "答えは `> 0` と `win += 1`。"
      wrong_hint3: "答えは `> 0` と `win += 1`。"

  # ─── 参考実装: リスト内包 vs for ループ vs NumPy ベクトル化 ──
  - kind: sample
    title: "参考実装 — for ループ / リスト内包 / NumPy ベクトル化の速度比較"
    markdown: |
      ## 同じ処理、3 つの書き方、3 つの速度

      Python で「リターン系列に税率を掛けて配当を加える」処理を例に、3 通り書きます。

      | スタイル | 例 | 速度 (10 万要素) |
      |---|---|---|
      | for ループ | `for r in xs: out.append(...)` | 遅い (基準) |
      | リスト内包 | `[r*0.8 + 0.001 for r in xs]` | 1.5-2x 速い |
      | NumPy ベクトル化 | `arr * 0.8 + 0.001` | **20-50x 速い** |

      **使い分け**:
      - 100 要素以下 → 好きな書き方で OK
      - 1 万〜 → リスト内包推奨（可読性◎、numpy 不要）
      - 10 万〜 → **必ず NumPy** (Python ループは遅すぎる)

      **金融特有の落とし穴**:
      - 1 日 4 万ティック × 200 銘柄 = 800 万要素 → for ループだと 1 分以上
      - 同じ計算が numpy なら 0.1 秒
      - 「現場の自動化スクリプト」で速度問題に当たったら、まず for をベクトル化
    sample_code: |
      import time
      import numpy as np

      n = 100_000
      data = [0.001 * (i % 100 - 50) for i in range(n)]

      # ① for ループ
      t0 = time.perf_counter()
      out1 = []
      for r in data:
          out1.append(r * 0.8 + 0.001)
      t1 = time.perf_counter() - t0

      # ② リスト内包
      t0 = time.perf_counter()
      out2 = [r * 0.8 + 0.001 for r in data]
      t2 = time.perf_counter() - t0

      # ③ NumPy ベクトル化
      arr = np.array(data)
      t0 = time.perf_counter()
      out3 = arr * 0.8 + 0.001
      t3 = time.perf_counter() - t0

      print(f"for ループ      : {t1*1000:7.2f} ms")
      print(f"リスト内包      : {t2*1000:7.2f} ms  ({t1/t2:5.1f}x faster)")
      print(f"NumPy ベクトル化: {t3*1000:7.2f} ms  ({t1/t3:5.1f}x faster)")
      print(f"\n結果が一致: {all(abs(a-b) < 1e-9 for a, b in zip(out1, out3))}")
    runnable: true
    stickman: explain
    stickman_speech: "ループ → 内包 → ベクトル化 と進むのが Python 修行の道筋。速度差は身体で覚えよう。"
