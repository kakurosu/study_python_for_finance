id: 27
title: "Web スクレイピング (requests + BeautifulSoup)"
phase: E
prerequisites: [10]
learning_goals:
  - "requests で HTTP リクエストを送れる"
  - "BeautifulSoup で HTML をパースして要素を抽出できる"
  - "利用規約・robots.txt の遵守の必要性を理解する"

pages:
  - kind: sample
    title: "スクレイピングの注意"
    markdown: |
      ## スクレイピング前に
      外部サイトを対象にする場合は、必ず:

      1. **サイトの利用規約** を確認する。
      2. **robots.txt** を確認する。
      3. リクエスト間隔を **最低 1 秒** 空ける。
      4. User-Agent を適切に設定する。

      この章では **ローカル HTML ファイル** (`data/sample_finance_news.html`) のみを対象に練習します。
      実サイトを叩く演習はありません。
    sample_code: |
      from pathlib import Path
      html = Path("data/sample_finance_news.html").read_text(encoding="utf-8")
      print(len(html), "文字")
    runnable: true
    stickman: explain
    stickman_speech: "公開サイトをスクレイピングする前に、必ず利用規約を読もう。"

  - kind: sample
    title: "BeautifulSoup の基本"
    markdown: |
      ## select で CSS セレクタ
      `BeautifulSoup` は HTML を木構造として扱えるライブラリ。
      `.select(セレクタ)` で CSS セレクタ風の検索ができます。
    sample_code: |
      from pathlib import Path
      from bs4 import BeautifulSoup
      html = Path("data/sample_finance_news.html").read_text(encoding="utf-8")
      soup = BeautifulSoup(html, "html.parser")
      titles = [a.text for a in soup.select("a.title")]
      for t in titles:
          print(t)
    runnable: true
    stickman: explain
    stickman_speech: "select は CSS セレクタが使えて便利。"

  - kind: exercise
    title: "HTML ファイルを読み込もう"
    prompt: |
      `data/sample_finance_news.html` を文字列で読み込んでください。
    code_template: |
      from pathlib import Path
      html = Path("data/sample_finance_news.html").{{slot:method}}(encoding="utf-8")
      print(len(html) > 0)
    blanks:
      - id: method
        canonical_answer: "read_text"
        accept_patterns: ['^read_text$']
        hint: "テキスト読み込みメソッド"
    test_cases:
      - kind: stdout_regex
        pattern: '^True\s*$'
    hints:
      - "`read_text`"
      - "`read_text`"
    stickman_feedback:
      correct: "Path 経由のファイル読み込みは現代的な書き方。"
      wrong_hint1: "`read_text`"
      wrong_hint2: "`read_text`"
      wrong_hint3: "`read_text`"

  - kind: exercise
    title: "ニュースタイトルを全部取り出そう"
    prompt: |
      `BeautifulSoup` で HTML をパースし、`a.title` クラスの **全テキスト** をリストに集めてください。
    code_template: |
      from pathlib import Path
      from bs4 import BeautifulSoup
      html = Path("data/sample_finance_news.html").read_text(encoding="utf-8")
      soup = BeautifulSoup(html, "html.parser")
      titles = [a.text for a in soup.{{slot:fn}}({{slot:sel}})]
      print(len(titles))
    blanks:
      - id: fn
        canonical_answer: "select"
        accept_patterns: ['^select$']
        hint: "CSS セレクタで取得"
      - id: sel
        canonical_answer: '"a.title"'
        accept_patterns:
          - '^"a\.title"$'
          - "^'a\\.title'$"
        hint: "a 要素で class=title"
    test_cases:
      - kind: stdout_regex
        pattern: '^5\s*$'
    hints:
      - "`select` と `\"a.title\"`。"
      - '`select` と `"a.title"`。'
    stickman_feedback:
      correct: "CSS セレクタ、便利。"
      wrong_hint1: '`select` と `"a.title"`。'
      wrong_hint2: '`select` と `"a.title"`。'
      wrong_hint3: '`select` と `"a.title"`。'

  - kind: exercise
    title: "為替レートテーブルから USD/JPY を抜こう"
    prompt: |
      `tr` 行を全部取り出し、最初の 2 行目（ヘッダ除く）から **USD/JPY の終値** を抽出してください。
      シンプルに `find_all` で要素を辿る方法を使います。
    code_template: |
      from pathlib import Path
      from bs4 import BeautifulSoup
      html = Path("data/sample_finance_news.html").read_text(encoding="utf-8")
      soup = BeautifulSoup(html, "html.parser")
      rows = soup.find_all("tr")
      cells = rows[1].{{slot:fn}}("td")
      print(cells[1].text)
    blanks:
      - id: fn
        canonical_answer: "find_all"
        accept_patterns: ['^find_all$']
        hint: "全要素を取り出すメソッド"
    test_cases:
      - kind: stdout_regex
        pattern: '^152\.30\s*$'
    hints:
      - "`find_all`"
      - "`find_all`"
    stickman_feedback:
      correct: "テーブルパース、これでOK。"
      wrong_hint1: "`find_all`"
      wrong_hint2: "`find_all`"
      wrong_hint3: "`find_all`"

  # ─── 参考実装: lxml + xpath vs BeautifulSoup の対比 ─────
  - kind: sample
    title: "参考実装 — lxml + XPath と BeautifulSoup の対比"
    markdown: |
      ## 2 大スクレイピング ライブラリの使い分け

      | 項目 | BeautifulSoup | lxml + XPath |
      |---|---|---|
      | 学習コスト | **低い** (英語っぽい API) | やや高い (XPath 構文) |
      | 速度 | 普通 | **数倍速い** |
      | パース耐性 | 壊れた HTML に強い | 厳密な XML 向き (HTML パーサもあり) |
      | 複雑な抽出 | ネストすると冗長 | **XPath 1 行** で書ける |

      **業界での選択**:
      - 試作 / 1 回限り → BeautifulSoup (書きやすさ優先)
      - 本番 / 大量サイト → lxml (速度・XPath の表現力)
      - **両方** インポートして使い分けるチームも多い

      **共通の現場ルール**:
      - `robots.txt` を必ず確認
      - リクエスト間隔は **最低 1 秒**、可能なら 3-5 秒
      - User-Agent を明示 (`requests.get(url, headers={"User-Agent": "my-bot/0.1"})`)
      - サイト改修で壊れることを前提に、抽出が失敗したら **fallback** とアラート
    sample_code: |
      from pathlib import Path

      # 既存の data/sample_finance_news.html を両方で解析してみる
      html_path = Path("data/sample_finance_news.html")
      html = html_path.read_text(encoding="utf-8") if html_path.exists() else "<html><body><h1 class='headline'>Demo News</h1><div class='body'>Hello world.</div></body></html>"

      # === A) BeautifulSoup ===
      from bs4 import BeautifulSoup
      soup = BeautifulSoup(html, "html.parser")
      bs_headline = soup.find(class_="headline")
      print(f"[BS]   headline text: {bs_headline.get_text(strip=True) if bs_headline else '(not found)'}")

      # === B) lxml + XPath ===
      try:
          from lxml import html as lxml_html
          tree = lxml_html.fromstring(html)
          xpath_headline = tree.xpath("//*[contains(@class, 'headline')]/text()")
          print(f"[lxml] headline text: {xpath_headline[0].strip() if xpath_headline else '(not found)'}")

          # XPath の真骨頂: 「class が card な div の中の最初の a タグの href」のような条件抽出
          sample = "<html><body><div class='card'><a href='http://a.com'>A</a></div><div class='card'><a href='http://b.com'>B</a></div></body></html>"
          t2 = lxml_html.fromstring(sample)
          hrefs = t2.xpath("//div[@class='card']/a/@href")
          print(f"\nXPath で抽出した href 一覧: {hrefs}")
      except ImportError:
          print("[lxml] 未インストール — `uv add lxml` でインストールすると XPath が使えます")
    runnable: true
    stickman: explain
    stickman_speech: "BS は書きやすい、lxml は速い。サイト規模で使い分けるのが現場の知恵。"
