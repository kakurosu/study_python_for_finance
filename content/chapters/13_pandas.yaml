id: 13
title: "pandas 入門"
phase: B
prerequisites: [12]
learning_goals:
  - "DataFrame と Series の違いを理解する"
  - "CSV を読み込んで列を選択できる"
  - "loc / iloc で行・列を取り出せる"
  - "describe で統計量を見られる"

pages:
  - kind: sample
    title: "pandas = 表データの王様"
    markdown: |
      ## DataFrame
      pandas の `DataFrame` はエクセルのような **2 次元の表** です。
      列名を指定して値を取り出したり、条件で絞り込んだりできます。
      `import pandas as pd` が定番。
    sample_code: |
      import pandas as pd
      df = pd.DataFrame({
          "fund": ["A", "B", "C"],
          "ret": [0.10, 0.06, 0.08],
          "vol": [0.18, 0.12, 0.14],
      })
      print(df)
      print(df["ret"].mean())
    runnable: true
    stickman: explain
    stickman_speech: "DataFrame は Excel のシートだと思えば OK！"

  - kind: sample
    title: "CSV の読み込み"
    markdown: |
      `pd.read_csv("path")` で CSV を読み込めます。
      `data/stock_prices.csv` には 60 営業日ぶんの 2 銘柄の終値が入っています。
    sample_code: |
      import pandas as pd
      df = pd.read_csv("data/stock_prices.csv")
      print(df.head())
      print(df.shape)
      print(df.columns.tolist())
    runnable: true
    stickman: explain
    stickman_speech: "head() で最初の 5 行、shape で行数×列数が分かるよ。"

  - kind: exercise
    title: "DataFrame を作ろう"
    prompt: |
      ファンド名と経費率を持つ DataFrame を作ってください。
      `pd.DataFrame()` の引数に **辞書** を渡します。
    code_template: |
      import pandas as pd
      df = pd.{{slot:cls}}({"name": ["A", "B", "C"], "expense": [0.012, 0.008, 0.020]})
      print(df.shape)
    blanks:
      - id: cls
        canonical_answer: "DataFrame"
        accept_patterns: ['^DataFrame$']
        hint: "pandas の表クラス"
    test_cases:
      - kind: stdout_regex
        pattern: '\(3, 2\)'
      - kind: namespace_check
        asserts:
          - "df.shape == (3, 2)"
    hints:
      - "クラス名は DataFrame（D 大文字）。"
      - "`DataFrame` だね。"
    stickman_feedback:
      correct: "辞書から DataFrame、便利だよね！"
      wrong_hint1: "クラス名の D は大文字。"
      wrong_hint2: "`DataFrame`"
      wrong_hint3: "`DataFrame`"

  - kind: exercise
    title: "CSV を読んで列を取り出そう"
    prompt: |
      `data/stock_prices.csv` を読み込んで、`AAA` 列だけを Series として `aaa` に入れてください。
    code_template: |
      import pandas as pd
      df = pd.read_csv("data/stock_prices.csv")
      aaa = df[{{slot:col}}]
      print(round(float(aaa.mean()), 2))
    blanks:
      - id: col
        canonical_answer: '"AAA"'
        accept_patterns:
          - '^"AAA"$'
          - "^'AAA'$"
        hint: "列名は文字列で指定"
    test_cases:
      - kind: stdout_regex
        pattern: '^957\.93\s*$'
    hints:
      - "列を取り出すのは `df[\"列名\"]`。"
      - '`"AAA"` を入れてね。'
    stickman_feedback:
      correct: "列の選択は分析の第一歩！"
      wrong_hint1: "クォートで列名を囲もう。"
      wrong_hint2: '`"AAA"`'
      wrong_hint3: '`"AAA"`'

  - kind: exercise
    title: "describe で要約統計を表示しよう"
    prompt: |
      `df[\"AAA\"]` の **要約統計（平均・標準偏差・最小・最大など）** を describe で表示してください。
    code_template: |
      import pandas as pd
      df = pd.read_csv("data/stock_prices.csv")
      summary = df["AAA"].{{slot:method}}()
      print(summary["mean"])
    blanks:
      - id: method
        canonical_answer: "describe"
        accept_patterns: ['^describe$']
        hint: "統計サマリのメソッド"
    test_cases:
      - kind: stdout_regex
        pattern: '957\.9'
    hints:
      - "Series の統計量メソッド。"
      - "`describe` だね。"
    stickman_feedback:
      correct: "describe は分析最初の儀式！"
      wrong_hint1: "サマリ統計の名前。"
      wrong_hint2: "`describe`"
      wrong_hint3: "`describe`"

  # ─── ⑥ 参考実装: loc / iloc / at / query の使い分け ────────────
  - kind: sample
    title: "参考実装 — loc / iloc / at / query の使い分け表"
    markdown: |
      ## 4 つのアクセサ、業界での使い分け

      pandas で「行と列を抜き出す」方法は 4 つあり、初学者が最も混乱する点です。
      **役割が違うので使い分けが必要**。

      | アクセサ | 指定方法 | 主な用途 | 速さ |
      |---|---|---|---|
      | `df.loc[i, c]` | **ラベル**（行 index 値・列名） | 範囲指定・条件指定 | 普通 |
      | `df.iloc[i, c]` | **整数位置** (0 始まり) | 順序ベースの処理 | 普通 |
      | `df.at[i, c]`  | ラベル（**単一セル**だけ） | 1 要素の高速読み書き | **最速** |
      | `df.query("expr")` | **文字列の条件式** | 複雑な条件フィルタ | 可読性◎ |

      **業界の経験則**:
      - 単一セル → `at`、複数セル → `loc`
      - 「上から N 行」「ランダムに 100 行」など順序系 → `iloc`
      - 条件が 2 つ以上 → `query` (`df[(df.A>0) & (df.B<5)]` より読みやすい)

      **ありがちな失敗**: `df[0:3]` は行 0-2、`df.loc[0:3]` は **行 0-3 (両端含む)**。`loc` は半開区間ではないので注意。
    sample_code: |
      import pandas as pd

      df = pd.read_csv("data/stocks_daily.csv", parse_dates=["date"]).set_index("date")
      print("--- df.loc (ラベル範囲) ---")
      print(df.loc["2023-01-02":"2023-01-06", ["AAPL_jp", "TOPIX"]])

      print("\n--- df.iloc (整数位置) ---")
      print(df.iloc[:3, :2])

      print("\n--- df.at (単一セル・最速) ---")
      print("AAPL_jp on 2023-01-02:", df.at[pd.Timestamp("2023-01-02"), "AAPL_jp"])

      print("\n--- df.query (条件式) ---")
      hot = df.query("AAPL_jp > 100 and TOPIX > 100")
      print(f"両方 100 超の日数: {len(hot)} / {len(df)}")
    runnable: true
    expected_output: "AAPL_jp on 2023-01-02"
    stickman: explain
    stickman_speech: "用途で使い分ける。実務では query が一番読みやすい場面が多いよ。"

  # ─── ⑦ 参考実装: method chaining で読み込み→集計を 1 行 ──────
  - kind: sample
    title: "参考実装 — method chaining (読込→pct_change→describe)"
    markdown: |
      ## pandas の真骨頂: メソッドチェーン

      pandas は **戻り値が DataFrame / Series** なので、メソッドを連結して
      「データの加工パイプライン」を 1 つの式で書けます (py4fi2nd でも頻出スタイル)。

      ```
      pd.read_csv(...)      # ① 読み込み
        .set_index(...)     # ② インデックス設定
        .pct_change()       # ③ 日次リターン
        .dropna()           # ④ 最初の NaN を削除
        .describe()         # ⑤ 統計サマリ
        .round(4)           # ⑥ 表示桁数
      ```

      **メリット**:
      - 中間変数を作らないので **メモリと名前空間を汚さない**
      - 読み手に「データの流れ」が伝わる
      - デバッグ時は途中で `.pipe(print)` を挟むだけ

      **注意点**:
      - 行が長くなりすぎる → 各メソッドを別行にして括弧で囲む (`(\n  .a()\n  .b()\n)`)
      - ステップ数が 6 を超えるなら **関数化** を検討
    sample_code: |
      import pandas as pd

      summary = (
          pd.read_csv("data/stocks_daily.csv", parse_dates=["date"])
            .set_index("date")
            .pct_change()
            .dropna()
            .describe()
            .round(4)
      )
      print(summary)

      # 中間結果が見たければ pipe で覗ける
      annual_vol = (
          pd.read_csv("data/stocks_daily.csv", parse_dates=["date"])
            .set_index("date")
            .pct_change()
            .dropna()
            .std()
            * (252 ** 0.5)
      )
      print("\n年率ボラ:")
      print(annual_vol.round(3))
    runnable: true
    stickman: explain
    stickman_speech: "メソッドチェーンは pandas の文化。慣れると一行で多くを語れるよ。"
