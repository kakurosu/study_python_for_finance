id: phase_b_test
title: Phase B 実力テスト
description: 数値・データライブラリ（章 11-14）の実力テスト。10 問・制限時間 30 分・合格基準 60%。
phase: B
time_limit_minutes: 30
pass_score: 0.6
questions:
- kind: exercise
  title: Q1. NumPy 配列を作る
  prompt: |-
    `[1, 2, 3]` から NumPy 配列を作ってください。

    **Phase B の論点**: NumPy / pandas / matplotlib の **API 名と axis 指定** が頻出。`print(df.shape)` `print(arr.dtype)` で形と型を都度確認する癖を。
  code_template: |
    import numpy as np
    a = np.{{slot:fn}}([1, 2, 3])
    print(a, type(a).__name__)
  blanks:
  - id: fn
    canonical_answer: array
    accept_patterns:
    - ^array$
  test_cases:
  - kind: stdout_regex
    pattern: ndarray
  stickman_feedback:
    correct: OK!
    wrong_hint1: 形をもう一度見直してみよう。 使う関数・記号は授業で出てきたものだよ。
    wrong_hint2: パターンは `array` に近い形だね。
    wrong_hint3: 答えは `array` だよ。
  hints:
  - 使う API・記号を思い出して、形を絞り込もう。 答えはおそらく **5 文字程度** の式。
  - パターンは `array` に似た形になる。
  - '答え: `array`'
- kind: exercise
  title: Q2. 配列に係数を掛ける
  prompt: |-
    配列 `r` の全要素を 100 倍してパーセント表示にしてください。

    **Phase B の論点**: NumPy / pandas / matplotlib の **API 名と axis 指定** が頻出。`print(df.shape)` `print(arr.dtype)` で形と型を都度確認する癖を。
  code_template: |
    import numpy as np
    r = np.array([0.01, -0.02, 0.005])
    pct = {{slot:expr}}
    print(pct)
  blanks:
  - id: expr
    canonical_answer: r * 100
    accept_patterns:
    - ^r\s*\*\s*100$
    - ^100\s*\*\s*r$
  test_cases:
  - kind: stdout_regex
    pattern: \[\s*1\.\s+-2\.\s+0\.5\s*\]
  stickman_feedback:
    correct: OK!
    wrong_hint1: 形をもう一度見直してみよう。 使う関数・記号は授業で出てきたものだよ。
    wrong_hint2: パターンは `r * 100` に近い形だね。
    wrong_hint3: 答えは `r * 100` だよ。
  hints:
  - 使う API・記号を思い出して、形を絞り込もう。 答えはおそらく **7 文字程度** の式。
  - パターンは `r * 100` に似た形になる。
  - '答え: `r * 100`'
