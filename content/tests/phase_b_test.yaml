    np.random.seed(0)
    sim = np.random.normal({{slot:loc}}, {{slot:scale}}, {{slot:size}})
    print(len(sim))
  blanks:
  - id: loc
    canonical_answer: '0'
    accept_patterns:
    - ^0(\.0)?$
  - id: scale
    canonical_answer: '0.01'
