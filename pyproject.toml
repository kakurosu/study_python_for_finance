[project]
name = "study-python-finance"
version = "0.1.0"
description = "Interactive Python study desktop app focused on finance / CMA exam topics"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "skokh" }]

dependencies = [
    # Local HTTP server hosting the HTML/CSS/JS UI (replaces the previous
    # PyQt6 / QWebEngineView shell). The UI runs in the user's browser.
    # Upper bound on fastapi sidesteps MAL-2026-4750: 0.136.x added an
    # undocumented `fastar` typosquat dep to the [standard] extras group.
    # We don't install [standard], but the pin keeps us safe even if a
    # future contributor adds the extras flag.
    "fastapi>=0.110,<0.136",
    # starlette is a transitive of fastapi; pinned directly to dodge
    # PYSEC-2026-161 (Host-header path injection, fixed in 1.0.1).
    "starlette>=1.0.1",
    "uvicorn[standard]>=0.27",
    # Jupyter kernel backend
    "jupyter_client>=8.6",
    "ipykernel>=6.29",
    # Data layer — progress is persisted in a single JSON file (see
    # app/db/repo.py); pydantic powers the request/response schemas and
    # the YAML chapter loader. No SQL engine, no ORM, no native libs.
    "pydantic>=2.6",
    "PyYAML>=6.0",
    # Syntax highlighter (still used by the test/grading layer for
    # post-mortem formatting of submitted code).
    "Pygments>=2.17",
    # openai SDK is taught in chapter 24 (kept as a learning dependency;
    # the in-app "Ask AI" feature that depended on anthropic was removed).
    "openai>=1.40",
    "python-dotenv>=1.0",
    # Numerics / data / charting
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    # Web
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    # Chapter 25 launches Streamlit live — moved from optional to core so
    # `uv sync` alone gives a working chapter 25 demo.
    "streamlit>=1.32",
]

[project.optional-dependencies]
deep = ["torch>=2.2"]
automation = ["pyautogui>=0.9.54", "playwright>=1.42"]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
study-python = "app.main:main"

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# --- uv -------------------------------------------------------------------
# uv (https://docs.astral.sh/uv/) is the recommended package / venv manager.
# Run `uv sync` to create the .venv and install dependencies declared above.
# Optional extras are exposed via `uv sync --extra dev --extra streamlit ...`.
[tool.uv]
package = true
managed = true
required-version = ">=0.11.6"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["tests/.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
