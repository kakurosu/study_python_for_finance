[project]
name = "study-python-finance"
version = "0.1.0"
description = "Interactive Python study desktop app focused on finance / CMA exam topics"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "skokh" }]

dependencies = [
    # UI
    "PyQt6>=6.6",
    # Modern icon set (Font Awesome / Material / Codicons via Qt). Used for
    # the primary action buttons so the dark UI reads more like a modern IDE.
    "QtAwesome>=1.3",
    # Jupyter kernel backend
    "jupyter_client>=8.6",
    "ipykernel>=6.29",
    # Data layer
    "SQLAlchemy>=2.0",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    # Code highlighting (Pygments-based syntax highlighter for QPlainTextEdit)
    "Pygments>=2.17",
    # LLM (optional — anthropic powers the in-app Ask AI feature; openai
    # is taught in chapter 24)
    "anthropic>=0.34",
    "openai>=1.40",
    "python-dotenv>=1.0",
    # Numerics / data / charting
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    # Web
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    # Chapter 25 launches Streamlit live — moved from optional to core so
    # `uv sync` alone gives a working chapter 25 demo.
    "streamlit>=1.32",
    "pyqt6-webengine>=6.11.0",
]

[project.optional-dependencies]
deep = ["torch>=2.2"]
automation = ["pyautogui>=0.9.54", "playwright>=1.42"]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
study-python = "app.main:main"

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# --- uv -------------------------------------------------------------------
# uv (https://docs.astral.sh/uv/) is the recommended package / venv manager.
# Run `uv sync` to create the .venv and install dependencies declared above.
# Optional extras are exposed via `uv sync --extra dev --extra streamlit ...`.
[tool.uv]
package = true
managed = true
required-version = ">=0.11.6"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["app/ui/.*", "tests/.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
